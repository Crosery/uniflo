acceptance:
  - id: A1
    source: brief.md
    text: 同一缓存目录有守护进程和 MCP/第二索引进程时，查询仍可用，不出现持续竞争写入；已有命中保留，新内容在写者中继续可检索。
    result: passed
    reason:
      text: 实现基于 .writer SQLite 独占写租约保证单写者，跟随者基于 data_version pragma
        刷新只读连接并同步内存映射与进度；写者退出时跟随者自动竞争接管；未提交命令计数器直到提交成功才扣减，回滚时 requeue_commands
        完整重回队首；MCP 一次性建库后主动调用 release_writer_when_idle 释放租约，重新探测到守护进程后自动清空 local
        缓存并切回 daemon。共享多读与接管单测、一次性租约释放单测均通过。
      truncated: false
  - id: A2
    source: brief.md
    text: 索引遇到暂态 SQLite 写竞争时，不丢弃已接收的索引内容，也不把失败的 pass 标为已完成。
    result: passed
    reason:
      text: 写事务改为 BEGIN IMMEDIATE，杜绝 WAL 延迟事务升级冲突（错误码 517）；写竞争失败触发 rollback、置位 lagged
        并将 pass 置为 None，不标记完成并重试全部未提交请求；store::open 仅对确认的数据库损坏删除重建，遇到锁与 I/O
        错误保留磁盘索引。修改后的真实锁争用测试 pinned_content_is_retried_after_a_busy_transaction
        给予 20s 异步调度余量，完整保留外部并发锁、报错计数增加、未提交前保持非 idle 及解锁后精确检索到 pinned 事件的全部断言。
      truncated: false
  - id: A3
    source: brief.md
    text: Windows 经确认的缺陷有修前失败、修后成功证据，并在 Windows 真实程序或 CI 上验证。
    result: passed
    reason:
      text: move_aside 在目标 .old 被占用时回退至独立三段式备份名 <exe>.old-<now:x>-<pid:x>-<seq:x>；最终
        staged 覆盖失败时严格按本次备份执行回滚；remove_aside 与 install.ps1 严格匹配三段式十六进制正则，保留
        Unicode 文件及 .old-dead/.old.bak 等非自身产物。LuoXi 真机 0.2.2 基线报 OS error 5 exit
        101，0.2.3 同程序 exit 0；swap_aside_windows_file_locking 单测通过；PowerShell 5.1
        完整安装与备份保留通过；CI 40224069422 Windows runner 5m49s 通过；发布后实际 x86_64 二进制在
        LuoXi 真机实跑通过。
      truncated: false
  - id: A4
    source: brief.md
    text: Linux 经确认的缺陷有修前失败、修后成功证据，并在 Linux 真实程序或 CI 上验证。
    result: passed
    reason:
      text: Linux 读取 /proc/<pid>/cmdline 的 NUL 字节切分得到完整 p.argv；arg_after
        优先按数组边界提取参数值，带空格参数不被截断。arch-linux 真机 0.2.2 基线截断为 /tmp/work exit
        101，0.2.3 完整提取 exit 0；linux_discovers_child_with_spaced_resume_arg
        单测通过；CI 40224069422 Ubuntu runner 2m53s 通过；发布后实际 x86_64 发布包在 arch-linux
        运行 daemon 验证 version 0.2.3、health=true。
      truncated: false
  - id: A5
    source: brief.md
    text: macOS 经确认的缺陷有修前失败、修后成功证据，并在本机真实程序上验证。
    result: passed
    reason:
      text: map_canonical_path 遍历所有配置根，将 FSEvents 规范化路径双向映射回所有匹配的前缀（同时通知软链接别名与物理根）。真实
        FSEvents 探针修前漏通知物理根 exit 101，修后双根均通知 exit 0；watcher 集成单测通过；CI
        40224069422 macOS runner 4m10s 通过；发布后 arm64 与 x86_64 发布包实际运行
        daemon-smoke（health 0.2.3、33 harness、合成 session、demo、no-fts 503）全部通过。
      truncated: false
  - id: A6
    source: brief.md
    text: 工作中会话、子代理按本轮 work 进入顺序排列；更新、加载更多、刷新不改变同一工作轮次顺序，idle 后再次 work
      排到队列末尾，空闲列表仍按最近活动排列。
    result: passed
    reason:
      text: Entry::refresh 识别同批读取中 TurnEnd 后紧随新输入且无 live override 的情形为 restarted，推进
        status_since 至新工作时间戳；sig 包含 status_since，驱动 SSE 广播快照；Web 端以 workSince
        排序，家族槽位记录在 sessionStorage 并在子代理成员交替结束时保持连续；全家 idle 后重新 work
        排到队尾；isPureWorkFilter 确保 s:work 筛选下活动更新不发生跳位。4 项 core
        单测、work-turn-batch-final（status_since 匹配新 user 1792955088196）以及网页端
        E2E_ONLY=runTree 19 项交互测试全部通过。
      truncated: false
