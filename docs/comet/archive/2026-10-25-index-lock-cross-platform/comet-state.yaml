    text: 用户明确确认新版本后发布补丁版；GitHub Release 的 5 个包与校验和、7 个 crate、官网和仓库版本与发布说明一致。
    result: passed
    reason:
      text: 用户明确授权后完成发布；GitHub Release v0.2.3 包含 8 项完整资产（5
        个平台发布包、SHA256SUMS、install.sh、install.ps1），isDraft=false，isPrerelease=false，publishedAt=2026-10-25T19:21:14Z；shasum
        校验 5 包全部 OK，脚本与验收源码一致；官方稀疏索引 7 个
