<style>
:root {
  --font-sans: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --fs-xs: 12px; --fs-sm: 13px; --fs-base: 14px; --fs-lg: 16px; --fs-xl: 20px;
  --r-xs: 2px; --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 12px;
  --dur: 150ms; --ease: cubic-bezier(.2, 0, 0, 1);

  color-scheme: dark;
  --bg: #101010; --bg-side: #121212; --bg-raised: #161616;
  --surface: rgba(255, 255, 255, .031); --surface-hover: rgba(255, 255, 255, .059); --surface-active: rgba(255, 255, 255, .085);
  --text: rgba(255, 255, 255, .936); --text-2: rgba(255, 255, 255, .618); --text-3: rgba(255, 255, 255, .422); --text-4: rgba(255, 255, 255, .284);
  --border: rgba(255, 255, 255, .08); --border-strong: rgba(255, 255, 255, .16);
  --accent: #9dbefe; --accent-bg: rgba(83, 132, 255, .16);
  --ok: #7ab948; --ok-bg: rgba(122, 185, 72, .14);
  --warn: #d1a041; --warn-bg: rgba(209, 160, 65, .13);
  --danger: #ee8884; --danger-bg: rgba(238, 136, 132, .12);
  --j-key: #9dbefe; --j-str: #00ceb9; --j-num: #d1a041; --j-lit: #c4a7ff;
  --hl: .80; --hc: .12;
  --shadow-lg: 0 16px 48px -6px rgba(0, 0, 0, .35), 0 6px 12px -2px rgba(0, 0, 0, .2);
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #fbfbfb; --bg-side: #f4f4f4; --bg-raised: #ffffff;
    --surface: rgba(0, 0, 0, .031); --surface-hover: rgba(0, 0, 0, .055); --surface-active: rgba(0, 0, 0, .085);
    --text: #171717; --text-2: #5f5f5f; --text-3: #8a8a8a; --text-4: #b8b8b8;
    --border: rgba(0, 0, 0, .08); --border-strong: rgba(0, 0, 0, .16);
    --accent: #2f6bff; --accent-bg: rgba(47, 107, 255, .1);
    --ok: #3d7f22; --ok-bg: rgba(61, 127, 34, .12); --warn: #9a6b0c; --warn-bg: rgba(154, 107, 12, .1);
    --danger: #b3322c; --danger-bg: rgba(179, 50, 44, .08);
    --j-key: #2f5fd0; --j-str: #0b7f72; --j-num: #9a6b0c; --j-lit: #7c4dce;
    --hl: .52; --hc: .14;
    --shadow-lg: 0 16px 48px -6px rgba(0, 0, 0, .12), 0 6px 12px -2px rgba(0, 0, 0, .06);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text); font: var(--fs-base)/1.5 var(--font-sans);
  -webkit-font-smoothing: antialiased; display: grid; grid-template-rows: auto minmax(0, 1fr); height: 100dvh; overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
::selection { background: var(--accent-bg); }
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.mono, code, pre, kbd { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 14px; height: 14px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- top bar ---------- */
.top { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto auto; align-items: center; gap: 8px 16px; padding: 8px 14px; background: var(--bg-side); border-bottom: .5px solid var(--border-strong); min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
.brand svg { width: 20px; height: 20px; }
.brand small { color: var(--text-3); font-weight: 400; font-size: var(--fs-sm); }
#conn { display: inline-flex; align-items: center; gap: 7px; min-height: 26px; padding: 0 4px 0 10px; border-radius: 999px; background: var(--surface); border: .5px solid var(--border-strong); font-size: var(--fs-xs); color: var(--text-2); white-space: nowrap; }
#conn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-4); flex: none; }
#conn[data-state=live] .dot { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }
#conn[data-state=connecting] .dot, #conn[data-state=retry] .dot { background: var(--warn); animation: breathe 1.2s infinite; }
.seg { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 2px; gap: 2px; flex: none; }
.seg button { border: 0; background: none; height: 20px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; color: var(--text-3); transition: background var(--dur) var(--ease), color var(--dur); }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--surface-active); color: var(--text); }
.metrics { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; font-size: var(--fs-xs); color: var(--text-3); min-width: 0; }
.metrics b { color: var(--text); font: 500 var(--fs-sm) var(--font-mono); font-variant-numeric: tabular-nums; margin-left: 5px; }
.metrics > span { white-space: nowrap; }
.metrics .spark { display: inline-flex; align-items: center; gap: 6px; }
.metrics svg { width: 64px; height: 18px; }
.metrics polyline { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linejoin: round; }
#m-api { font: var(--fs-xs) var(--font-mono); color: var(--text-4); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; max-width: 180px; }
.iconbtn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: var(--r-md); border: 0; background: none; color: var(--text-3); transition: background var(--dur), color var(--dur); flex: none; }
.iconbtn:hover, .iconbtn.on { background: var(--surface-hover); color: var(--text); }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- layout ---------- */
.app { --side-width: clamp(240px, 26vw, 320px); display: grid; grid-template-columns: var(--side-width) minmax(0, 1fr) 300px; min-height: 0; min-width: 0; }
.app.norail { grid-template-columns: var(--side-width) minmax(0, 1fr) 0; }
.app.norail .rail { display: none; }
.side, .rail { background: var(--bg-side); min-height: 0; min-width: 0; display: flex; flex-direction: column; }
.side { border-right: .5px solid var(--border-strong); overflow-y: auto; }
.rail { border-left: .5px solid var(--border-strong); overflow-y: auto; }

/* ---------- sidebar ---------- */
.search { padding: 12px 12px 8px; flex: none; }
.field { position: relative; }
.field svg { position: absolute; left: 9px; top: 8px; color: var(--text-3); }
#q { width: 100%; height: 30px; padding: 0 34px 0 30px; border-radius: var(--r-md); background: var(--surface); border: .5px solid var(--border-strong); font: var(--fs-sm) var(--font-mono); outline: none; transition: background var(--dur), box-shadow var(--dur); }
#q::placeholder { color: var(--text-4); font-family: var(--font-sans); }
#q:hover { background: var(--surface-hover); }
#q:focus { box-shadow: 0 0 0 2px var(--accent-bg), 0 0 0 1px var(--accent); background: var(--bg); }
kbd { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: var(--r-xs); background: var(--surface); border: .5px solid var(--border-strong); font-size: 11px; color: var(--text-3); }
.field kbd { position: absolute; right: 7px; top: 6px; }
.qmeta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; margin-top: 6px; font-size: 11.5px; color: var(--text-4); }
.qmeta b { color: var(--text-3); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 12px 10px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: var(--r-sm); background: var(--surface); border: 0; font-size: var(--fs-xs); font-weight: 500; color: var(--text-2); white-space: nowrap; transition: background var(--dur), color var(--dur); }
.chip:hover { background: var(--surface-hover); color: var(--text); }
.chip.on { background: var(--accent-bg); color: var(--accent); }
.hdot { width: 6px; height: 6px; border-radius: 50%; background: oklch(var(--hl) var(--hc) var(--h)); }
.harness-filter { padding: 0 12px 12px; flex: none; min-width: 0; }
.harness-filter label { display: block; margin-bottom: 4px; font-size: var(--fs-xs); color: var(--text-3); }
#harness-state { font-size: var(--fs-xs); color: var(--danger); }
.harness-combo.ts-wrapper { --ts-pr-min: 28px; width: 100%; min-width: 0; font: var(--fs-sm)/1.5 var(--font-sans); color: var(--text-2); }
.harness-combo .ts-control { min-height: 32px; padding: 5px 28px 5px 10px; border: .5px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface); color: var(--text-2); box-shadow: none; flex-wrap: nowrap; gap: 6px; cursor: pointer; }
.harness-combo.ts-wrapper.single.input-active .ts-control { background: var(--surface); color: var(--text-2); }
.harness-combo .ts-control:hover { background: var(--surface-hover); }
.harness-combo.focus .ts-control { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-bg); }
.harness-combo .ts-control > input { min-width: 0; font: inherit; color: var(--text); }
.harness-combo .ts-control > input::placeholder { color: var(--text-3); }
.harness-combo.disabled .ts-control { opacity: .6; cursor: not-allowed; }
.harness-filter.error .ts-control { border-color: var(--danger); }
.harness-combo.single .ts-control::after { content: ""; position: absolute; right: 11px; top: 50%; width: 6px; height: 6px; margin: 0; border: solid var(--text-3); border-width: 0 1.5px 1.5px 0; transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.harness-combo.dropdown-active .ts-control::after { transform: translateY(-20%) rotate(225deg); }
.harness-combo.ts-dropdown { z-index: 20; margin: 4px 0 0; padding: 4px; border: .5px solid var(--border-strong); border-radius: var(--r-md); background: var(--bg-raised); color: var(--text-2); box-shadow: var(--shadow-lg); font: var(--fs-sm)/1.5 var(--font-sans); overflow: hidden; }
.harness-combo.ts-dropdown.drop-up { margin: 0; transform: translateY(calc(-100% - 4px)); }

.harness-combo .option, .harness-combo .no-results { padding: 7px 8px; border-radius: var(--r-sm); }
.harness-combo .option.active { background: var(--surface-hover); color: var(--text); }
.harness-combo .option.selected { background: var(--accent-bg); color: var(--accent); }
.harness-combo .option.selected .h-selected { display: flex; }

.h-option { display: flex; align-items: center; gap: 6px; min-width: 0; width: 100%; }
.h-option .hdot { flex: none; }
.h-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.h-count { flex: none; font: 11px var(--font-mono); color: var(--text-3); }
.h-working { flex: none; font: 11px var(--font-mono); color: var(--ok); white-space: nowrap; }
.h-selected { display: none; align-items: center; flex: none; }
.label { padding: 10px 14px 4px; font-size: 11px; font-weight: 500; color: var(--text-4); letter-spacing: .04em; display: flex; justify-content: space-between; }
#list { flex: 1; min-height: 120px; overflow-y: auto; padding: 0 6px 12px; }
.row { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 0 6px; padding: 7px 8px; border-radius: var(--r-md); cursor: pointer; position: relative; transition: background var(--dur); }
.row:hover { background: var(--surface-hover); }

.ht { display: inline-flex; align-items: center; height: 17px; padding: 0 5px; border-radius: var(--r-xs); font: 500 11px var(--font-mono); color: oklch(var(--hl) var(--hc) var(--h)); background: oklch(var(--hl) var(--hc) var(--h) / .12); flex: none; }

.wrap { max-width: 760px; margin: 0 auto; width: 100%; }
.sh-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.sh-top h2 { margin: 0; font-size: var(--fs-lg); font-weight: 600; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: var(--fs-xs); font-weight: 500; flex: none; background: var(--surface-hover); color: var(--text-2); }
.badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-4); }
.badge.work { background: var(--ok-bg); color: var(--ok); }
.badge.work i { background: var(--ok); animation: breathe 1.6s infinite; }
.sh-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 8px; font-size: var(--fs-xs); color: var(--text-3); }
.sh-meta > span { min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
.sh-meta .mono { font-size: 11.5px; color: var(--text-2); }
.sh-meta .key { cursor: copy; border-bottom: 1px dashed var(--border-strong); }
#timeline { flex: 1; min-height: 0; overflow-y: auto; scroll-behavior: auto; }
#thread { padding: 18px var(--conv-pad) 64px; }
#more { display: flex; margin: 0 auto 14px; height: 26px; padding: 0 12px; border-radius: 999px; border: .5px solid var(--border-strong); background: var(--surface); color: var(--text-2); font-size: var(--fs-xs); align-items: center; gap: 6px; }
#more:hover { background: var(--surface-hover); color: var(--text); }
.ev { position: relative; }
.ev.enter { animation: enter 240ms var(--ease); }
.ev + .ev { margin-top: 10px; }
.ev .when { position: absolute; top: 2px; right: 100%; margin-right: 10px; font: 11px var(--font-mono); color: var(--text-4); opacity: 0; transition: opacity var(--dur); white-space: nowrap; }
.ev:hover > .when { opacity: 1; }

.k-user_message:not(.syn) { display: flex; justify-content: flex-end; margin: 22px 0 14px; }
.bubble { max-width: 82%; padding: 9px 14px; border-radius: var(--r-xl); background: var(--surface-active); font-size: var(--fs-base); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.k-user_message:not(.syn) .when { right: auto; left: 0; margin: 0; top: 10px; }

.k-assistant_message { font-size: 15px; line-height: 1.68; }
.k-assistant_message.partial .md > :last-child::after { content: ""; display: inline-block; width: 7px; height: 15px; margin-left: 3px; vertical-align: -2px; background: var(--text-2); animation: caret 1s steps(1) infinite; }
.md { word-break: break-word; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 .7em; }
.md h3, .md h4, .md h5, .md h6 { margin: 1.1em 0 .45em; font-size: var(--fs-base); font-weight: 600; letter-spacing: -.005em; }
.md h3 { font-size: var(--fs-lg); }
.md ul, .md ol { margin: 0 0 .7em; padding-left: 1.4em; }
.md li { margin: .2em 0; }
.md li::marker { color: var(--text-3); }
.md blockquote { margin: 0 0 .7em; padding: 0 0 0 12px; border-left: 2px solid var(--border-strong); color: var(--text-2); }
.md a { color: var(--accent); text-decoration: none; border-bottom: .5px solid currentColor; }
.md hr { border: 0; border-top: .5px solid var(--border-strong); margin: 1em 0; }
.md code { font-size: .86em; padding: 1px 5px; border-radius: var(--r-sm); background: var(--surface-hover); }
.md table { border-collapse: collapse; margin: 0 0 .8em; font-size: var(--fs-sm); display: block; overflow-x: auto; }
.md th, .md td { border: .5px solid var(--border-strong); padding: 4px 10px; text-align: left; }
.md th { background: var(--surface); font-weight: 600; }
.code { margin: 0 0 .8em; border-radius: var(--r-lg); border: .5px solid var(--border-strong); background: var(--surface); overflow: hidden; }
.code-h { display: flex; justify-content: space-between; align-items: center; height: 28px; padding: 0 6px 0 12px; font: 11px var(--font-mono); color: var(--text-3); border-bottom: .5px solid var(--border); }
.copy { border: 0; background: none; color: var(--text-3); font-size: 11px; height: 20px; padding: 0 6px; border-radius: var(--r-sm); }
.copy:hover { background: var(--surface-hover); color: var(--text); }
pre { margin: 0; padding: 10px 12px; font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; overflow: auto; max-height: 360px; }
.code pre code { background: none; padding: 0; font-size: inherit; }

/* collapsible rows: reasoning, tools, notices */
details > summary { list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }
.chev { width: 14px; height: 14px; color: var(--text-4); transition: transform var(--dur) var(--ease), opacity var(--dur); opacity: 0; flex: none; }
summary:hover .chev, details[open] > summary .chev { opacity: 1; }
details[open] > summary .chev { transform: rotate(90deg); }
.think > summary, .note > summary { display: flex; align-items: center; gap: 6px; min-height: 26px; padding: 3px 0; min-width: 0; font-size: var(--fs-sm); color: var(--text-3); }
.think > summary:hover, .note > summary:hover { color: var(--text-2); }
.think .lbl { font-style: italic; white-space: nowrap; flex: none; }
.think .cnt { font: 11px var(--font-mono); color: var(--text-4); white-space: nowrap; }
.think-body { margin: 4px 0 6px 6px; padding: 2px 0 2px 14px; border-left: 2px solid var(--border-strong); color: var(--text-2); font-size: var(--fs-sm); line-height: 1.6; white-space: pre-wrap; word-break: break-word; max-height: 420px; overflow: auto; }
.note-label { flex: none; max-width: 45%; overflow-wrap: anywhere; }
.note .pv { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; color: var(--text-4); }
.note.warn > summary { color: var(--warn); }
.note pre { margin: 4px 0 6px; border-radius: var(--r-md); background: var(--surface); border: .5px solid var(--border); color: var(--text-2); }

.tool { border-radius: var(--r-lg); border: .5px solid var(--border-strong); background: var(--surface); transition: background var(--dur), border-color var(--dur); }
.tool:hover { background: var(--surface-hover); }
.tool.error { border-color: color-mix(in srgb, var(--danger) 40%, transparent); background: var(--danger-bg); }
.ev.k-tool_call + .ev.k-tool_call, .ev.k-tool_call + .ev.k-tool_result, .ev.k-tool_result + .ev.k-tool_call { margin-top: 4px; }
.tool > summary { display: flex; align-items: center; gap: 8px; min-height: 32px; padding: 6px 10px; min-width: 0; font-size: var(--fs-sm); }
.tool .ti { color: var(--text-3); display: flex; flex: none; }
.tool .tn { font-weight: 500; flex: none; max-width: 45%; overflow-wrap: anywhere; }
.tool .ta { flex: 1; min-width: 0; font: 12px var(--font-mono); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool .td { font: 11px var(--font-mono); color: var(--text-4); font-variant-numeric: tabular-nums; flex: none; }
.st-ok { color: var(--ok); display: flex; } .st-err { color: var(--danger); display: flex; } .st-none { color: var(--text-4); font-size: 11px; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--border-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
.tool-body { padding: 0 10px 10px; display: grid; gap: 8px; }
.blk { border-radius: var(--r-md); border: .5px solid var(--border); background: var(--bg); overflow: hidden; }
.blk-h { display: flex; flex-wrap: wrap; gap: 4px 8px; min-height: 24px; align-items: center; padding: 4px 10px; font-size: 11px; color: var(--text-3); border-bottom: .5px solid var(--border); overflow-wrap: anywhere; }
.blk-h .mono { min-width: 0; max-width: 100%; }
.blk.err .blk-h { color: var(--danger); }
.j-k { color: var(--j-key); } .j-s { color: var(--j-str); } .j-n { color: var(--j-num); } .j-l { color: var(--j-lit); }
.cut { color: var(--warn); }

.k-turn_start { display: none; }
.k-turn_end { display: flex; align-items: center; gap: 10px; margin: 18px 0 !important; font: 11px var(--font-mono); color: var(--text-4); }
.k-turn_end > span { min-width: 0; overflow-wrap: anywhere; }
.k-turn_end::before, .k-turn_end::after { content: ""; flex: 1; border-top: .5px solid var(--border); }
.k-usage { display: none; }   /* summed onto the turn divider instead */
.think-empty { display: flex; align-items: center; height: 22px; padding-left: 20px; font-size: var(--fs-sm); font-style: italic; color: var(--text-4); }
.ev.k-reasoning + .ev.k-reasoning { margin-top: 2px; }

.shimmer { background: linear-gradient(90deg, var(--text-3) 0%, var(--text) 50%, var(--text-3) 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.2s linear infinite; }

.empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-3); text-align: center; padding: 24px; }
.empty svg { width: 36px; height: 36px; opacity: .6; }
.empty h3 { margin: 4px 0 0; font-size: var(--fs-base); font-weight: 500; color: var(--text-2); }
.empty p { margin: 0; font-size: var(--fs-sm); }
.keys { display: flex; gap: 14px; margin-top: 8px; font-size: var(--fs-xs); color: var(--text-4); }
.keys span { display: inline-flex; gap: 6px; align-items: center; }
.sk { border-radius: var(--r-sm); background: linear-gradient(90deg, var(--surface) 25%, var(--surface-active) 50%, var(--surface) 75%); background-size: 200% 100%; animation: sk 1.2s linear infinite; }

/* ---------- right rail ---------- */
.sec { padding: 12px 14px; border-bottom: .5px solid var(--border); }
.sec-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 11px; font-weight: 500; color: var(--text-4); letter-spacing: .04em; }
.sec-h .ok { color: var(--ok); font: 500 11px var(--font-mono); letter-spacing: 0; }
.sec-h .bad { color: var(--danger); }
.linkbtn { border: 0; background: none; color: var(--text-3); font-size: 11px; padding: 2px 6px; border-radius: var(--r-sm); }
.linkbtn:hover { background: var(--surface-hover); color: var(--text); }
.chk { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto 14px; align-items: center; gap: 6px; height: 26px; font-size: var(--fs-xs); border-bottom: .5px solid var(--border); }
.chk:last-child { border-bottom: 0; }
.mth { font: 500 10px var(--font-mono); color: var(--text-3); background: var(--surface-hover); border-radius: var(--r-xs); padding: 1px 0; text-align: center; }
.pth { font: 11.5px var(--font-mono); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chk .ms { font: 11px var(--font-mono); color: var(--text-3); font-variant-numeric: tabular-nums; text-align: right; }
.chk .ms.slow { color: var(--warn); }
.chk .ic { display: flex; justify-content: center; }
.chk[data-ok=true] .ic { color: var(--ok); } .chk[data-ok=false] .ic { color: var(--danger); }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.cards { grid-template-columns: repeat(4, 1fr); }
.card { padding: 6px 8px; border-radius: var(--r-md); background: var(--surface); border: .5px solid var(--border); min-width: 0; }
.card span { display: block; font-size: 10.5px; color: var(--text-3); white-space: nowrap; }
.card b { display: block; margin-top: 1px; font: 600 var(--fs-base) var(--font-sans); font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
.card b small { font-size: 11px; font-weight: 400; color: var(--text-3); margin-left: 2px; }
.card.bad b { color: var(--danger); }
#ticker { font: 11.5px/1.75 var(--font-mono); padding: 0 14px 14px; }
.tk { display: grid; grid-template-columns: 54px 7px minmax(0, 1fr); gap: 7px; align-items: center; white-space: nowrap; animation: slide 150ms var(--ease); }
.tk time { color: var(--text-4); }
.tk i { width: 5px; height: 5px; border-radius: 50%; background: var(--text-4); }
.tk.t-event i { background: var(--ok); } .tk.t-session i { background: var(--accent); } .tk.t-removed i, .tk.t-lagged i { background: var(--danger); }
.tk span { overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }
.tk span em { font-style: normal; color: var(--text-4); }
.tk-empty { margin: 4px 0 0; font: var(--fs-xs) var(--font-sans); color: var(--text-4); line-height: 1.6; }

body.redact .txt, body.redact pre, body.redact .md { filter: blur(5px); }

@keyframes breathe { 50% { opacity: .45; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes caret { 50% { opacity: 0; } }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@keyframes sk { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@keyframes enter { from { opacity: 0; transform: translateY(4px); } }
@keyframes slide { from { opacity: 0; transform: translateX(-4px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 1180px) {
  .top { grid-template-columns: auto auto minmax(0, 1fr); }
  .brand small, #m-api, #rail-toggle, .metrics .opt, .metrics .spark svg { display: none; }
  .app, .app.norail { grid-template-columns: var(--side-width) minmax(0, 1fr) 0; }
  .rail { display: none; }
}
@media (max-width: 960px) {
  .top { grid-template-columns: minmax(0, 1fr) auto; }
  .metrics { grid-column: 1 / -1; }
}
@media (max-width: 760px) {
  .app, .app.norail { grid-template-columns: minmax(0, 1fr); }
  .side { border-right: 0; }
  .app.thread-open .side, .app:not(.thread-open) .conv { display: none; }
  .conv-nav { display: flex; }
}
@media (max-width: 600px) {
  .top { grid-template-columns: minmax(0, 1fr); }
  #conn { justify-self: start; }
}

<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#9dbefe"/><stop offset="1" stop-color="#7ab948"/></linearGradient></defs>
      <path d="M3 5.5c7 0 8 6.5 18 6.5M3 12h18M3 18.5c7 0 8-6.5 18-6.5" stroke="url(#g)"/>
    </svg>
    uniflo <small>live sessions</small>
  </div>
  <span id="conn" data-state="idle"><span class="dot"></span><span id="conn-text">未连接</span>
    <span class="seg" id="transport">
      <button data-transport="sse" title="Server-Sent Events · /v1/stream">SSE</button>
      <button data-transport="ws" title="WebSocket · /v1/ws">WS</button>
      <button data-transport="ndjson" title="NDJSON · /v1/stream.ndjson">NDJSON</button>
    </span>
  </span>
  <div class="metrics">
    <span>会话<b id="m-sessions">–</b></span>
    <span>工作中<b id="m-working">–</b></span>
    <span class="spark">流速<b id="m-rate">0</b><svg viewBox="0 0 60 18" preserveAspectRatio="none"><polyline id="spark" points=""/></svg></span>
    <span class="opt">seq<b id="m-seq">0</b></span>
    <span class="opt">REST<b id="m-rest">–</b></span>
  </div>
  <span id="m-api"></span>
  <button class="iconbtn on" id="rail-toggle" title="显示 / 隐藏右侧面板" aria-controls="right" aria-expanded="true">
    <svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg>
  </button>
</header>

<div class="app" id="app">
  <aside class="side" id="session-list-panel">
    <div class="search">
      <div class="field">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" aria-label="搜索会话、目录、标题" placeholder="搜索会话、目录、标题…" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </div>
      <div class="qmeta"><span>s:work · h:claude · in:dir · since:2h</span><span id="q-info"></span></div>
    </div>
    <div class="chips" id="quick">
      <button class="chip" data-tok="s:work">工作中</button>
      <button class="chip" data-tok="is:live">有进程</button>
      <button class="chip" data-tok="is:root">顶层</button>
      <button class="chip" data-tok="since:1d">24 小时</button>
    </div>
    <div class="harness-filter" id="harnesses">
      <label for="harness-select">Agent harness</label>
      <select id="harness-select" class="harness-combo" disabled><option value="">加载 harness…</option></select>
      <span id="harness-state" role="status" hidden></span>
    </div>
    <div id="list"></div>
  </aside>

  <main class="conv">
    <nav class="conv-nav" aria-label="会话导航"><button class="chip" id="show-list" aria-controls="session-list-panel"><svg class="i" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>会话列表</button></nav>
    <div id="detail-head" hidden></div>
    <div id="timeline">
      <div class="empty" id="welcome">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M3 5.5c7 0 8 6.5 18 6.5M3 12h18M3 18.5c7 0 8-6.5 18-6.5" stroke="url(#g)"/></svg>
        <h3>选择一个会话</h3>
        <p>所有 harness 的会话都已归一成同一种事件流，实时更新。</p>
        <div class="keys"><span><kbd>/</kbd>搜索</span><span><kbd>j</kbd><kbd>k</kbd>切换会话</span><span><kbd>esc</kbd>退出搜索</span></div>
      </div>
    </div>
  </main>

  <aside class="rail" id="right">
    <div class="sec">
      <div class="sec-h"><span>接口自检</span><span><span id="chk-sum" class="ok"></span> <button class="linkbtn" id="recheck">重测</button></span></div>
      <div id="checks"></div>
    </div>
    <div class="sec">
      <div class="sec-h"><span>索引</span><span id="uptime" class="mono"></span></div>
      <div class="cards" id="statgrid"></div>
    </div>
    <div class="sec" style="border-bottom:0;padding-bottom:6px">
      <div class="sec-h"><span>实时 ENVELOPE</span><span class="mono" id="t-count">0</span></div>
    </div>
    <div id="ticker"><p class="tk-empty">等待实时事件：任何会话写入新内容，都会在这里按 seq 顺序出现。</p></div>
  </aside>
</div>

// ---------------------------------------------------------------- formatting
function age(ms) {

  const s = Math.max(0, (Date.now() - ms) / 1000);
  if (s < 60) return Math.floor(s) + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";

}

// Markdown subset: fences, headings, lists, quotes, tables, rules, inline code/bold/italic/links.
// Input is escaped before any tag is added, and links are limited to http(s).
function inline(s) {
  const codes = [];
  s = esc(s).replace(/`([^`\n]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`);
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<em>$2</em>")
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

function codeBlock(code, lang) {
  return `<div class="code"><div class="code-h"><span>${esc(lang || "text")}</span><button class="copy" data-copy>复制</button></div><pre><code>${esc(code)}</code></pre></div>`;
}
function md(src) {
  const L = String(src).replace(/\r\n?/g, "\n").split("\n"), out = [];
  const isList = (l) => /^\s*([-*+]|\d+[.)])\s+/.test(l);

      while (i < L.length && /^\s*\|.*\|\s*$/.test(L[i])) rows.push(cells(L[i++]));
      out.push(`<table><thead><tr>${head.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`);

function json(v) {
  const s = typeof v === "string" ? v : JSON.stringify(v, null, 2);
  return esc(s).replace(/(&quot;(?:[^&\\]|\\.|&(?!quot;))*?&quot;)(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g,
    (m, str, colon, lit, num) => str ? (colon ? `<span class="j-k">${str}</span>${colon}` : `<span class="j-s">${str}</span>`)

}

// ---------------------------------------------------------------- http + self-check
function url(path, q = {}) {
  const u = new URL(API + path);
  for (const [k, v] of Object.entries(q)) if (v !== undefined && v !== null && v !== "") u.searchParams.set(k, v);
  if (TOKEN) u.searchParams.set("token", TOKEN);

}
const CHECKS = [
  ["health", "GET", "/v1/health"], ["harnesses", "GET", "/v1/harnesses"], ["stats", "GET", "/v1/stats"],
  ["sessions", "GET", "/v1/sessions?q="], ["sessions_ndjson", "GET", "/v1/sessions?format=ndjson"],

}
function renderChecks() {
  checksQueued = false;
  let good = 0;

    const c = checkState.get(id);
    if (c?.ok) good++;
    const ms = c && c.ms != null ? c.ms.toFixed(1) : "";
    const ic = !c ? '<span class="spin"></span>' : icon(c.ok ? "check" : "x");

  }).join("");

async function api(name, path, q) {
  const t0 = performance.now();

    const r = await fetch(url(path, q));
    const text = await r.text();
    const ms = performance.now() - t0;
    const body = q && q.format === "ndjson" ? text.split("\n").filter(Boolean).map((l) => JSON.parse(l)) : JSON.parse(text);
    if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);

  const given = P.get("api");

    try {
      const r = await fetch(location.origin + "/v1/health" + (TOKEN ? "?token=" + encodeURIComponent(TOKEN) : ""));
      if (r.ok) return location.origin;

// ---------------------------------------------------------------- session list

  } else if (!filtered()) {

  const value = queryHarness();

  const data = [{ value: "", text: "全部 harness", name: "全部 Agent harness", rank: 0,

  if (value && !data.some((x) => x.value === value)) data.push({ value, text: "查询：" + value, query: true, disabled: true, rank: -1 });

  for (const option of data) {

    if (!old) { harnessSelect.addOption(option); changed = true; }

function toolInfo(name, input) {
  const n = (name || "").toLowerCase();
  const ic = /bash|shell|exec|command|terminal|run|cmd/.test(n) ? "term"
    : /edit|write|patch|apply|replace|create|str_replace/.test(n) ? "edit"
    : /read|view|cat|open|file/.test(n) ? "file"
    : /grep|glob|search|find|ls|list/.test(n) ? "search"
    : /web|fetch|http|url|browse/.test(n) ? "globe"
    : /task|agent|delegate|spawn/.test(n) ? "agent" : "tool";
  const o = input && typeof input === "object" && !Array.isArray(input) ? input : {};
  const action = o.action && typeof o.action === "object" ? o.action : {};
  let arg = o.command ?? o.cmd ?? o.file_path ?? o.filePath ?? o.path ?? o.pattern
    ?? o.query ?? action.query ?? action.queries?.[0]
    ?? o.search_term ?? o.searchTerm ?? o.q ?? o.url ?? o.description ?? o.prompt
    ?? Object.values(o).find((v) => typeof v === "string") ?? (typeof input === "string" ? input : "");

}

    const isPast = Array.from(T?.evs?.values() || []).some(
      (e) => e.ts > call.ts && (e.kind === "assistant_message" || e.kind === "turn_end" || (e.kind === "tool_result" && e.call_id !== call.call_id))

}

    case "reasoning":

      }

    case "tool_call": {

  }
}
function renderNode(e) {

// Tool results render inside their call's card; a result whose call is not loaded yet
// (older page) stands alone until the call arrives.
function upsertEvent(e, live, anchor) {
  T.evs.set(e.id, e);
  if (e.kind === "tool_result" && e.call_id) {
    T.results.set(e.call_id, e);
    const callId = T.calls.get(e.call_id);
    if (callId) { drop(e.id); return place(T.evs.get(callId), live); }
  }
  if (e.kind === "tool_call" && e.call_id) {
    T.calls.set(e.call_id, e.id);
    const r = T.results.get(e.call_id);
    if (r) drop(r.id);
  }
  place(e, live, anchor);
}
function place(e, live, anchor) {
  const node = renderNode(e);
  const old = T.nodes.get(e.id);
  if (old) old.replaceWith(node);
  else $("#thread").insertBefore(node, anchor || null);
  T.nodes.set(e.id, node);
  if (live) node.classList.add("enter");
  if (e.kind === "turn_end") turnTotal(node);
}
// Token usage of a turn, summed from the usage events since the previous divider.
function turnTotal(node) {
  const sum = { input: 0, output: 0, cache_read: 0, n: 0 };
  for (let n = node.previousElementSibling; n && !n.classList.contains("k-turn_end"); n = n.previousElementSibling) {
    const u = n.dataset.kind === "usage" && T.evs.get(n.dataset.id);
    if (u) { sum.input += u.input || 0; sum.output += u.output || 0; sum.cache_read += u.cache_read || 0; sum.n++; }
  }
  if (sum.n) node.querySelector("span").insertAdjacentText("beforeend", ` · in ${fmtN(sum.input)} · out ${fmtN(sum.output)}${sum.cache_read ? ` · cache ${fmtN(sum.cache_read)}` : ""}`);
}
function drop(id) {
  const n = T.nodes.get(id);
  if (n) { n.remove(); T.nodes.delete(id); }
}
function refreshPendingTools() {
  if (!T || T.loading) return;
  for (const [callId, id] of T.calls) if (!T.results.has(callId)) place(T.evs.get(id), false);
}

  const mine = T;

// ---------------------------------------------------------------- live stream
function openStream(kind, q, onEnv, onErr) {
  if (kind === "sse") {
    const es = new EventSource(url("/v1/stream", q));
    for (const t of ["hello", "session", "event", "removed", "lagged"]) es.addEventListener(t, (m) => onEnv(JSON.parse(m.data)));
    es.onerror = () => { es.close(); onErr(new Error("sse error")); };
    return { close: () => es.close() };
  }
  if (kind === "ws") {
    const ws = new WebSocket(url("/v1/ws", q).replace(/^http/, "ws"));
    let closed = false;
    ws.onmessage = (m) => onEnv(JSON.parse(m.data));
    ws.onclose = () => { if (!closed) onErr(new Error("ws closed")); };
    return { close: () => { closed = true; ws.close(); } };
  }
  const ac = new AbortController();
  (async () => {
    const r = await fetch(url("/v1/stream.ndjson", q), { signal: ac.signal });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const rd = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await rd.read();
      if (done) throw new Error("stream ended");
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i);
        buf = buf.slice(i + 1);
        if (line) onEnv(JSON.parse(line));
      }
    }
  })().catch((e) => { if (!ac.signal.aborted) onErr(e); });
  return { close: () => ac.abort() };
}
function setConn(state, text) {
  $("#conn").dataset.state = state;
  $("#conn-text").textContent = text;
  document.querySelectorAll("#transport button").forEach((b) => b.classList.toggle("on", b.dataset.transport === transport));
}
function connect() {
  clearTimeout(reconnectTimer);
  conn?.close();
  const t0 = performance.now();
  setConn("connecting", "连接中");
  conn = openStream(transport, { since: lastSeq, max_text: MAX_TEXT }, (env) => {
    if (env.type === "hello") {
      check(transport, true, performance.now() - t0, "hello");
      setConn("live", "实时");
    }
    onEnv(env);
  }, (err) => {
    check(transport, false, performance.now() - t0, String(err.message || err));
    setConn("retry", "重连中");
    reconnectTimer = setTimeout(connect, 1000);
  });
}
function onEnv(env) {
  envTotal++;
  perSecond[perSecond.length - 1]++;
  if (env.type === "hello") {
    if (env.seq < lastSeq) resync(); // daemon restarted: seq starts over
    return;
  }
  if (env.type !== "lagged" && env.seq <= lastSeq) return; // replay overlap, already applied
  lastSeq = Math.max(lastSeq, env.seq);
  $("#m-seq").textContent = lastSeq;
  switch (env.type) {
    case "session": upsertSession(env.session); break;
    case "removed": removeSession(env.key); break;
    case "lagged": return resync();
    case "event":
      if (T && env.event.session === T.key) {
        if (T.loading) T.pending.push(env.event);
        else { upsertEvent(env.event, true); scrollBottom(false); }
      }
      break;
  }
  tick(env);
}

const tickQueue = [];
let tickQueued = false;
function tick(env) {
  let what;
  if (env.type === "event") what = `${esc(short(env.event.session))} <em>${env.event.kind}${env.event.partial ? "…" : ""}</em>`;
  else if (env.type === "session") what = `${esc(short(env.session.key))} <em>→ ${env.session.status}</em>`;
  else what = esc(env.key || `missed ${env.missed}`);
  tickQueue.push(`<div class="tk t-${env.type}"><time>${clock(Date.now())}</time><i></i><span>${what}</span></div>`);
  if (tickQueued) return;
  tickQueued = true;
  requestAnimationFrame(() => {
    tickQueued = false;
    const box = $("#ticker");
    box.querySelector(".tk-empty")?.remove();
    box.insertAdjacentHTML("afterbegin", tickQueue.splice(0).slice(-60).reverse().join(""));
    while (box.childElementCount > 80) box.lastElementChild.remove();
    $("#t-count").textContent = envTotal;
  });
}

async function resync() {
  conn?.close();
  setConn("connecting", "重新同步");
  try {
    const r = await runSearch();
    lastSeq = r.seq;
    if (selected) select(selected);
    refreshMeta().catch(() => {});
  } catch {}
  connect();
}

// Probe every transport once (connect → hello → close); the active one stays open.
async function probeTransports() {
  for (const kind of ["sse", "ws", "ndjson"]) {
    if (kind === transport) continue;
    checkState.delete(kind);
    renderChecks();
    await new Promise((done) => {
      const t0 = performance.now();
      let h = null;
      const timer = setTimeout(() => { h?.close(); check(kind, false, null, "timeout"); done(); }, 4000);
      h = openStream(kind, { since: lastSeq, types: "removed" }, (env) => {
        if (env.type !== "hello") return;
        clearTimeout(timer); check(kind, true, performance.now() - t0, "hello"); h.close(); done();
      }, (err) => { clearTimeout(timer); check(kind, false, performance.now() - t0, String(err.message || err)); done(); });
    });
  }
  api("sessions_ndjson", "/v1/sessions", { format: "ndjson", limit: 20 }).catch(() => {});
}

// ---------------------------------------------------------------- interaction
document.addEventListener("click", (e) => {
  const chip = e.target.closest(".chip[data-tok]");
  if (chip) {
    const tok = chip.dataset.tok;
    let toks = $("#q").value.split(/\s+/).filter(Boolean);
    toks = toks.includes(tok) ? toks.filter((t) => t !== tok) : [...toks, tok];
    $("#q").value = toks.join(" ");
    syncFilters();
    queueSearch(0);
    return;
  }
  const row = e.target.closest(".row[data-key]");
  if (row) return select(row.dataset.key);
  if (e.target.closest("#more")) return loadEarlier(e.target.closest("#more"));
  const tb = e.target.closest("#transport button");
  if (tb && tb.dataset.transport !== transport) {
    transport = tb.dataset.transport;
    localStorage.setItem("uniflo.transport", transport);
    connect();
    probeTransports();
    return;
  }
  const copy = e.target.closest("[data-copy]");
  if (copy) {
    navigator.clipboard?.writeText(copy.closest(".code").querySelector("code").textContent);
    copy.textContent = "已复制";
    setTimeout(() => (copy.textContent = "复制"), 1200);
    return;
  }
  const key = e.target.closest("[data-copy-text]");
  if (key) navigator.clipboard?.writeText(key.dataset.copyText);
});
document.addEventListener("toggle", (e) => {
  const id = e.target.dataset?.openId;
  if (!id || !T) return;
  e.target.open ? T.open.add(id) : T.open.delete(id);
}, true);
$("#q").addEventListener("input", () => { syncFilters(); queueSearch(); });
$("#recheck").addEventListener("click", async () => {
  await refreshMeta().catch(() => {});
  await runSearch().catch(() => {});
  if (selected) select(selected, false);
  probeTransports();
});
$("#rail-toggle").addEventListener("click", (e) => {
  const hidden = $("#app").classList.toggle("norail");
  e.currentTarget.classList.toggle("on", !hidden);
  e.currentTarget.setAttribute("aria-expanded", String(!hidden));
});
function showList() {
  $("#app").classList.remove("thread-open");
  $("#q").focus();
}
$("#show-list").addEventListener("click", showList);
document.addEventListener("keydown", (e) => {
  if (e.target.closest(".ts-wrapper, .ts-dropdown")) return;
  const typing = e.target.matches?.("input, textarea");
  if ((e.key === "/" && !typing) || (e.key === "k" && (e.metaKey || e.ctrlKey))) {
    e.preventDefault();
    $("#app").classList.remove("thread-open");
    $("#q").focus();
    $("#q").select();
    return;
  }
  if (typing) {
    if (e.key === "Escape") e.target.blur();
    if (e.key === "Enter" && shown.length) {
      e.preventDefault();
      e.target.blur();
      select(shown[0]);
    }
    return;
  }
  if (e.key === "Escape" && narrowLayout.matches && $("#app").classList.contains("thread-open")) {
    showList();
    return;
  }
  const d = e.key === "j" || e.key === "ArrowDown" ? 1 : e.key === "k" || e.key === "ArrowUp" ? -1 : 0;
  if (!d || !shown.length) return;
  e.preventDefault();
  const i = shown.indexOf(selected);
  const next = shown[i < 0 ? 0 : Math.max(0, Math.min(shown.length - 1, i + d))];
  if (next && next !== selected) {
    select(next);
    requestAnimationFrame(() => document.querySelector(`.row[data-key="${CSS.escape(next)}"]`)?.scrollIntoView({ block: "nearest" }));
  }
});

setInterval(() => {
  document.querySelectorAll(".age[data-ts]").forEach((n) => (n.textContent = age(Number(n.dataset.ts))));
  const last5 = perSecond.slice(-5).reduce((a, b) => a + b, 0);
  $("#m-rate").textContent = (last5 / 5).toFixed(1);
  const max = Math.max(1, ...perSecond);
  $("#spark").setAttribute("points", perSecond.map((v, i) => `${i},${17 - (v / max) * 15}`).join(" "));
  perSecond.shift();
  perSecond.push(0);
}, 1000);
setInterval(() => refreshMeta().catch(() => {}), 5000);

(async function main() {
  renderChecks();
  skeletonList();
  setConn("idle", "未连接");
  API = await resolveApi();
  try {
    await refreshMeta();
    const r = await runSearch();
    lastSeq = r.seq;                 // gap-free: the stream replays everything after the snapshot
    $("#m-seq").textContent = lastSeq;
    connect();
    const first = P.get("select") || (r.body.find((s) => s.status === "work") || r.body[0])?.key;
    if (first) select(first, P.has("select"));
    probeTransports();
  } catch (e) {
    setConn("retry", "无法连接");
    $("#list").innerHTML = `<div class="empty"><h3>连不上 ${esc(API)}</h3><p>先运行 <kbd>uniflo daemon</kbd></p></div>`;
  }
})();
</script>
