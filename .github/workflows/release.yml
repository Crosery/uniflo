name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Parse tag and determine release channel
        id: tag_info
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "channel=prerelease" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "prerelease_flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "prerelease_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify workspace before publish
        run: |
          scripts/verify.sh

      - name: Publish crates to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          scripts/publish-crates.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag_info.outputs.tag }}"
          CHANNEL="${{ steps.tag_info.outputs.channel }}"
          PRERELEASE_FLAG="${{ steps.tag_info.outputs.prerelease_flag }}"

          if [[ "$CHANNEL" == "prerelease" ]]; then
            TITLE="Uniflo $TAG (Pre-release)"
          else
            TITLE="Uniflo $TAG"
          fi

          gh release create "$TAG" \
            --title "$TITLE" \
            --generate-notes \
            $PRERELEASE_FLAG
