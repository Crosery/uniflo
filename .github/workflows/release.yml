name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag_info.outputs.tag }}
      version: ${{ steps.tag_info.outputs.version }}
      channel: ${{ steps.tag_info.outputs.channel }}
      prerelease_flag: ${{ steps.tag_info.outputs.prerelease_flag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Parse tag and determine release channel
        id: tag_info
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "channel=prerelease" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "prerelease_flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "prerelease_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify workspace before publish
        run: |
          scripts/verify.sh

      - name: Publish crates to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          scripts/publish-crates.sh

  # Prebuilt binaries (ADR-0009): one package per target, named and laid out by scripts/package.sh;
  # the same names are in [package.metadata.binstall] of crates/uniflo-cli/Cargo.toml.
  build:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check the tag matches the workspace version
        run: |
          WANT="${{ needs.publish.outputs.version }}"
          HAVE="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          [[ "$HAVE" == "$WANT" ]] || { echo "tag v$WANT does not match Cargo.toml version $HAVE" >&2; exit 1; }

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked -p uniflo --target ${{ matrix.target }}

      - name: Package
        run: |
          TARGET="${{ matrix.target }}"
          EXE="uniflo"
          [[ "$TARGET" == *windows* ]] && EXE="uniflo.exe"
          scripts/package.sh "${{ needs.publish.outputs.version }}" "$TARGET" "target/$TARGET/release/$EXE" dist

      - uses: actions/upload-artifact@v4
        with:
          name: uniflo-${{ matrix.target }}
          path: dist/uniflo-*
          if-no-files-found: error

  release:
    needs: [publish, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: uniflo-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          PKGS=(uniflo-*)
          [[ ${#PKGS[@]} -eq 5 ]] || { ls -l; echo "expected 5 packages, got ${#PKGS[@]}" >&2; exit 1; }
          sha256sum uniflo-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ needs.publish.outputs.tag }}"
          CHANNEL="${{ needs.publish.outputs.channel }}"
          PRERELEASE_FLAG="${{ needs.publish.outputs.prerelease_flag }}"

          if [[ "$CHANNEL" == "prerelease" ]]; then
            TITLE="Uniflo $TAG (Pre-release)"
          else
            TITLE="Uniflo $TAG"
          fi

          cp scripts/install.sh scripts/install.ps1 dist/
          # Hand-written notes for this tag go first; GitHub's generated list is appended.
          NOTES=()
          if [[ -f "docs/releases/$TAG.md" ]]; then NOTES=(--notes-file "docs/releases/$TAG.md"); fi
          gh release create "$TAG" dist/* \
            --title "$TITLE" \
            "${NOTES[@]}" \
            --generate-notes \
            $PRERELEASE_FLAG
