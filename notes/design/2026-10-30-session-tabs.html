<style>
/* Tokens: every color is light-dark(light, dark). `color-scheme` on <html> picks the side: both
   (follow the system) by default, one when [data-scheme] pins it. Text steps clear WCAG AA on every
   surface they sit on; hierarchy comes from size and weight first. Chart colors: a fixed categorical
   order and a one-hue heat ramp. */
:root {
  color-scheme: light dark;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", system-ui, sans-serif;
  --font-mono: "SF Mono", ui-monospace, "JetBrains Mono", "Cascadia Code", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace;
  --fs-2xs: 11px; --fs-xs: 12px; --fs-sm: 13px; --fs-base: 14px; --fs-md: 15px; --fs-lg: 17px; --fs-xl: 22px; --fs-2xl: 28px;
  --r-xs: 3px; --r-sm: 5px; --r-md: 7px; --r-lg: 10px; --r-xl: 14px;
  --dur: 140ms; --ease: cubic-bezier(.2, .8, .2, 1);
  --rail-w: 68px; --list-w: 340px; --insp-w: 312px;

  --bg: light-dark(#ffffff, #0f0f11); --bg-rail: light-dark(#f3f3f5, #0a0a0b); --bg-side: light-dark(#fafafa, #131315);
  --bg-raised: light-dark(#ffffff, #18181b); --bg-overlay: light-dark(#ffffff, #1d1d21); --panel: light-dark(#ffffff, #131315);
  --code-bg: light-dark(#f7f7f8, #0b0b0d);
  --hover: light-dark(rgba(0, 0, 0, .04), rgba(255, 255, 255, .045)); --active: light-dark(rgba(0, 0, 0, .065), rgba(255, 255, 255, .075));
  --text: light-dark(#17171a, #ededef); --text-2: light-dark(#3f3f46, #b6b6bd); --text-3: light-dark(#626269, #9a9aa2);
  --border: light-dark(rgba(0, 0, 0, .065), rgba(255, 255, 255, .065)); --border-2: light-dark(rgba(0, 0, 0, .095), rgba(255, 255, 255, .1));
  --border-strong: light-dark(rgba(0, 0, 0, .15), rgba(255, 255, 255, .15));
  --accent: light-dark(#4a55c4, #9aa4ff); --accent-solid: #5e6ad2; --accent-solid-hover: light-dark(#5260c8, #6c78e0); --on-solid: #fff;
  --accent-bg: light-dark(rgba(94, 106, 210, .09), rgba(110, 123, 242, .15)); --accent-border: light-dark(rgba(94, 106, 210, .35), rgba(154, 164, 255, .38));
  --work: light-dark(#0c7043, #3fcf8e); --work-bg: light-dark(rgba(12, 112, 67, .1), rgba(63, 207, 142, .13)); --ok: var(--work);
  --warn: light-dark(#8f5200, #f2b14a); --warn-bg: light-dark(rgba(214, 140, 20, .12), rgba(242, 177, 74, .12));
  --danger: light-dark(#cd2b31, #ff8080); --danger-bg: light-dark(rgba(205, 43, 49, .07), rgba(255, 128, 128, .11)); --danger-solid: #d93036;
  --c1: light-dark(#5e6ad2, #7d87f0); --c2: light-dark(#2a9189, #4aa89f); --c3: light-dark(#c08a33, #c99a52); --c4: light-dark(#c0637f, #c47790);
  --c5: light-dark(#8b74c9, #9a8bd3); --c6: light-dark(#4f88b8, #6497bf); --c7: light-dark(#6f8f3a, #8fae63); --c-other: light-dark(#a1a1a9, #64646c);
  --heat-0: light-dark(#ededf0, rgba(255, 255, 255, .05)); --heat-1: light-dark(#d5d8fb, #272a5c); --heat-2: light-dark(#a2a9f2, #3b43a0);
  --heat-3: light-dark(#6c76dd, #6470dc); --heat-4: light-dark(#3a43a4, #b0b7ff);
  --grid: light-dark(rgba(0, 0, 0, .07), rgba(255, 255, 255, .07));
  --mark: light-dark(rgba(255, 196, 0, .32), rgba(242, 177, 74, .22)); --mark-text: light-dark(#5c3d00, #ffd58a);
  --j-key: light-dark(#4a55c4, #9aa4ff); --j-str: light-dark(#2e7d32, #a5d6a7); --j-num: light-dark(#b5531c, #f78c6c); --j-lit: light-dark(#8839c4, #c792ea);
  --shadow-pop: 0 16px 40px -12px light-dark(rgba(16, 24, 40, .22), rgba(0, 0, 0, .7)), 0 0 0 1px light-dark(rgba(0, 0, 0, .07), rgba(255, 255, 255, .07));
  --shadow-card: 0 1px 2px light-dark(rgba(16, 24, 40, .04), transparent);
  --logo-a: light-dark(#5e6ad2, #9aa4ff); --logo-b: light-dark(#0c7043, #3fcf8e);
  --hero-glow: light-dark(rgba(94, 106, 210, .08), rgba(110, 123, 242, .14));
}
:root[data-scheme=light] { color-scheme: light; }
:root[data-scheme=dark] { color-scheme: dark; }

/* ---------- base ---------- */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100dvh; overflow: hidden;
  background: var(--bg); color: var(--text); font: var(--fs-base)/1.55 var(--font-sans); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body > .rail { grid-column: 1; grid-row: 1; }
body > .app, body > .view { grid-column: 2; grid-row: 1; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
::selection { background: var(--accent-bg); }
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.mono, code, pre, kbd { font-family: var(--font-mono); font-variant-ligatures: none; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-3); }
.sm { font-size: var(--fs-xs); }
.grow { flex: 1 1 auto; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
svg.i { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
button:focus-visible, summary:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--border-2); border-bottom-width: 1.5px; background: var(--bg-raised); color: var(--text-3); font-size: 10.5px; line-height: 1; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); flex: none; }
.dot.work { background: var(--work); }
.dot.pulse { animation: pulse 1.8s var(--ease) infinite; }

/* Harness icon: the brand glyph (or two letters) on a hue-tinted tile. */
.hi { width: 16px; height: 16px; flex: none; fill: currentColor; fill-rule: evenodd; color: var(--text-2); }
.hi.hl { display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-sm); font: 650 9px/1 var(--font-sans); letter-spacing: -.02em;
  color: light-dark(oklch(.42 .11 var(--h)), oklch(.86 .09 var(--h))); background: light-dark(oklch(.95 .035 var(--h)), oklch(.32 .05 var(--h))); }
.htile { --s: 30px; position: relative; width: var(--s); height: var(--s); flex: none; display: inline-grid; place-items: center; border-radius: 8px;
  background: light-dark(oklch(.95 .035 var(--h)), oklch(.32 .05 var(--h))); box-shadow: inset 0 0 0 1px var(--border); }
.htile .hi { width: 58%; height: 58%; color: light-dark(oklch(.42 .11 var(--h)), oklch(.86 .09 var(--h))); }
.htile .hi.hl { width: 100%; height: 100%; background: none; font-size: 11px; }
.htile.sm { --s: 22px; border-radius: 6px; } .htile.sm .hi.hl { font-size: 9px; }
.htile.xs { --s: 18px; border-radius: 5px; } .htile.xs .hi.hl { font-size: 8px; }
.hchip { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text-2); white-space: nowrap; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: var(--r-md); border: 1px solid var(--border-2); background: var(--bg-raised); color: var(--text); font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; box-shadow: var(--shadow-card); transition: background var(--dur), border-color var(--dur), color var(--dur); }
.btn:hover:not(:disabled) { background: var(--hover); border-color: var(--border-strong); }
.btn:disabled { opacity: .5; }
.btn.sm { height: 28px; padding: 0 10px; font-size: var(--fs-xs); gap: 5px; } .btn.sm svg.i { width: 14px; height: 14px; }
.btn.ghost { background: none; border-color: transparent; box-shadow: none; color: var(--text-2); }
.btn.ghost:hover:not(:disabled) { background: var(--hover); color: var(--text); }
.btn.primary { background: var(--accent-solid); border-color: transparent; color: var(--on-solid); box-shadow: 0 1px 2px rgba(0, 0, 0, .2), inset 0 1px 0 rgba(255, 255, 255, .12); }
.btn.primary:hover:not(:disabled) { background: var(--accent-solid-hover); }
.btn.primary-soft { background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent); box-shadow: none; }
.btn.primary-soft:hover:not(:disabled) { background: color-mix(in srgb, var(--accent-bg) 100%, var(--accent) 8%); }
.btn.danger { background: var(--danger-solid); color: #fff; border-color: transparent; }
.btn.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--danger-solid) 90%, #000); }
.icon-btn { display: inline-grid; place-items: center; width: 30px; height: 30px; border: 0; border-radius: var(--r-md); background: none; color: var(--text-3); transition: background var(--dur), color var(--dur); flex: none; }
.icon-btn:hover, .icon-btn.on { background: var(--hover); color: var(--text); }
.icon-btn svg.i { width: 16px; height: 16px; }
.icon-btn.xs { width: 24px; height: 24px; } .icon-btn.xs svg.i { width: 13px; height: 13px; }
.linkbtn { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 2px 6px; border-radius: var(--r-sm); color: var(--accent); font-size: var(--fs-xs); }
.linkbtn:hover { background: var(--hover); }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 9px; background: var(--hover); box-shadow: inset 0 0 0 1px var(--border); flex: none; }
.seg button { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: none; color: var(--text-3); font-size: var(--fs-sm); font-weight: 500; white-space: nowrap; transition: color var(--dur), background var(--dur); }
.seg button svg.i { width: 14px; height: 14px; }
.seg button:hover { color: var(--text); }
.seg button.on, .seg button[aria-pressed=true] { background: var(--bg-raised); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .18), 0 0 0 1px var(--border-2); }
.seg.sm button { height: 24px; padding: 0 10px; font-size: var(--fs-xs); }
.seg.full { display: flex; } .seg.full button { flex: 1; justify-content: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--border-2); background: none; color: var(--text-2); font-size: var(--fs-xs); white-space: nowrap; transition: color var(--dur), border-color var(--dur), background var(--dur); }
.chip:hover:not(:disabled) { color: var(--text); border-color: var(--border-strong); background: var(--hover); }
.chip.on { background: var(--accent-bg); border-color: var(--accent-border); color: var(--accent); }
.chip:disabled { opacity: .5; }
.chip .dot { width: 6px; height: 6px; }
.input { height: 32px; padding: 0 10px; border-radius: var(--r-md); background: var(--bg-raised); border: 1px solid var(--border-2); font-size: var(--fs-sm); color: var(--text); outline: none; min-width: 0; transition: border-color var(--dur), box-shadow var(--dur); }
.input::placeholder { color: var(--text-3); }
.input:focus { border-color: var(--accent-border); box-shadow: 0 0 0 3px var(--accent-bg); }
.status-pill { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px; border-radius: 999px; font-size: var(--fs-xs); color: var(--text-2); background: var(--hover); border: 1px solid var(--border); white-space: nowrap; }
.status-pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.status-pill.warn { color: var(--warn); background: var(--warn-bg); border-color: transparent; }
.status-pill.warn i { background: var(--warn); }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: var(--fs-2xs); font-weight: 500; flex: none; white-space: nowrap; color: var(--text-3); background: var(--hover); }
.badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); }
.badge.work { color: var(--work); background: var(--work-bg); }
.badge.work i { background: var(--work); animation: pulse 1.8s var(--ease) infinite; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: var(--r-sm); font-size: var(--fs-2xs); font-weight: 500; white-space: nowrap; background: var(--hover); color: var(--text-2); flex: none; }
.tag svg.i { width: 12px; height: 12px; }
.tag.ok { background: var(--work-bg); color: var(--work); }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.bad { background: var(--danger-bg); color: var(--danger); }
.tag.acc { background: var(--accent-bg); color: var(--accent); }
.count { margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: var(--hover); color: var(--text-3); font-size: var(--fs-2xs); font-weight: 500; font-variant-numeric: tabular-nums; }
.count:empty { display: none; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: var(--r-lg); border: 1px solid var(--border-2); background: var(--hover); font-size: var(--fs-sm); color: var(--text-2); line-height: 1.6; }
.notice svg.i { margin-top: 3px; color: var(--text-3); }
.notice.warn { border-color: color-mix(in srgb, var(--warn) 30%, transparent); background: var(--warn-bg); color: var(--text); }
.notice.warn svg.i { color: var(--warn); }
.notice.bad { border-color: color-mix(in srgb, var(--danger) 30%, transparent); background: var(--danger-bg); color: var(--text); }
.notice code, .hsyn code, .md code { font-size: .88em; padding: .1em .38em; border-radius: 4px; background: var(--hover); border: 1px solid var(--border); }
.search-box { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px 0 10px; border-radius: var(--r-md); background: var(--bg-raised); border: 1px solid var(--border-2); color: var(--text-3); transition: border-color var(--dur), box-shadow var(--dur); }
.search-box:focus-within { border-color: var(--accent-border); box-shadow: 0 0 0 3px var(--accent-bg); }
.search-box input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); font-size: var(--fs-sm); }
.search-box input::placeholder { color: var(--text-3); }
.grow-box { flex: 1 1 260px; }
.status-line { font-size: var(--fs-xs); color: var(--text-3); min-height: 18px; }
.status-line.bad { color: var(--danger); }

/* Tom Select, themed as the page's dropdown button. */
.combo.ts-wrapper { --ts-pr-min: 28px; width: 100%; min-width: 0; font: var(--fs-sm)/1.5 var(--font-sans); color: var(--text); }
.combo .ts-control { min-height: 32px; padding: 4px 28px 4px 10px; border: 1px solid var(--border-2); border-radius: var(--r-md); background: var(--bg-raised); color: var(--text); box-shadow: var(--shadow-card); flex-wrap: nowrap; gap: 6px; cursor: pointer; transition: border-color var(--dur); }
.combo.ts-wrapper.single.input-active .ts-control { background: var(--bg-raised); color: var(--text); }
.combo .ts-control:hover { border-color: var(--border-strong); }
.combo.focus .ts-control { border-color: var(--accent-border); box-shadow: 0 0 0 3px var(--accent-bg); }
.combo .ts-control > input { min-width: 0; font: inherit; color: var(--text); }
.combo .ts-control > input::placeholder { color: var(--text-3); }
.combo.disabled .ts-control { opacity: .6; cursor: not-allowed; }
.harness-filter.error .ts-control { border-color: var(--danger); }
.combo.single .ts-control::after { content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; margin: 0; border: solid var(--text-3); border-width: 0 1.5px 1.5px 0; transform: translateY(-70%) rotate(45deg); pointer-events: none; transition: transform var(--dur); }
.combo.dropdown-active .ts-control::after { transform: translateY(-20%) rotate(225deg); }
.combo.ts-dropdown { z-index: 60; margin: 6px 0 0; padding: 5px; border: 0; border-radius: var(--r-lg); background: var(--bg-overlay); color: var(--text); box-shadow: var(--shadow-pop); font: var(--fs-sm)/1.5 var(--font-sans); overflow: hidden; animation: pop .14s var(--ease); }
.combo.ts-dropdown.drop-up { margin: 0; transform: translateY(calc(-100% - 6px)); animation: none; }
.combo .ts-dropdown-content { max-height: min(300px, max(0px, calc(var(--h-max-height, 310px) - 10px))); padding: 0; overscroll-behavior: contain; scroll-behavior: auto; }
.combo .option, .combo .no-results { padding: 6px 9px; border-radius: 6px; }
.combo .no-results { color: var(--text-3); text-align: center; }
.combo .option.active { background: var(--hover); color: var(--text); }
.combo .option.selected { background: var(--accent-bg); color: var(--text); }
.combo .option.selected .h-selected { display: flex; color: var(--accent); }
.h-option { display: flex; align-items: center; gap: 9px; min-width: 0; width: 100%; }
.h-option .hi { width: 15px; height: 15px; color: light-dark(oklch(.42 .11 var(--h, 250)), oklch(.86 .09 var(--h, 250))); }
.h-option svg.i { color: var(--text-3); }
.h-option .hi.hl { width: 18px; height: 18px; font-size: 8px; }
.h-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.h-count { flex: none; font-size: var(--fs-xs); color: var(--text-3); font-variant-numeric: tabular-nums; }
.h-working { flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-2xs); color: var(--work); white-space: nowrap; }
.h-working::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--work); }
.h-selected { display: none; align-items: center; flex: none; }
.combo.u-f.ts-wrapper { flex: 0 1 180px; width: auto; min-width: 124px; }
.combo.u-f.wide.ts-wrapper { flex-basis: 220px; }
.combo.ts-dropdown.u-f { min-width: 300px; max-width: calc(100vw - 16px); }
.combo .ts-control .item { min-width: 0; flex: 1; overflow: hidden; }
.h-option .c-main { display: flex; flex-direction: column; flex: 1; min-width: 0; line-height: 1.35; }
.h-option .c-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: var(--fs-2xs) var(--font-mono); color: var(--text-3); }
.h-option .c-stat { display: flex; align-items: baseline; flex: none; gap: 8px; }
.h-option .h-cost { min-width: 46px; text-align: right; font-size: var(--fs-xs); color: var(--text-2); font-variant-numeric: tabular-nums; }

/* Checkbox: one component look for the table (appearance: none), accent fill, tick or dash. */
input[type=checkbox].cb { appearance: none; -webkit-appearance: none; display: inline-grid; place-content: center; width: 16px; height: 16px; margin: 0; flex: none; border: 1.5px solid var(--border-strong); border-radius: 4.5px; background: var(--bg-raised); cursor: pointer; vertical-align: middle; transition: background var(--dur), border-color var(--dur); }
input[type=checkbox].cb:hover:not(:disabled) { border-color: var(--accent); }
input[type=checkbox].cb:checked, input[type=checkbox].cb:indeterminate { background: var(--accent-solid); border-color: var(--accent-solid); }
input[type=checkbox].cb:checked::after { content: ""; width: 8px; height: 4px; margin-top: -2px; border: solid #fff; border-width: 0 0 2px 2px; transform: rotate(-45deg); }
input[type=checkbox].cb:indeterminate::after { content: ""; width: 8px; height: 0; border-top: 2px solid #fff; }
input[type=checkbox].cb:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--accent-bg), 0 0 0 1px var(--accent); }
input[type=checkbox].cb:disabled { opacity: .35; cursor: not-allowed; }

/* Air Datepicker, themed with the page tokens. */
#u-dates { width: 212px; cursor: pointer; text-overflow: ellipsis; }
.air-datepicker { --adp-font-family: var(--font-sans); --adp-font-size: var(--fs-sm); --adp-z-index: 60; --adp-width: 262px; --adp-padding: 8px; --adp-border-radius: var(--r-lg); --adp-cell-border-radius: var(--r-md);
  --adp-background-color: var(--bg-overlay); --adp-background-color-hover: var(--hover); --adp-background-color-active: var(--active);
  --adp-background-color-in-range: var(--accent-bg); --adp-background-color-in-range-focused: var(--accent-bg);
  --adp-background-color-selected-other-month: var(--accent-solid); --adp-background-color-selected-other-month-focused: var(--accent-solid);
  --adp-color: var(--text); --adp-color-secondary: var(--text-3); --adp-accent-color: var(--accent); --adp-color-current-date: var(--accent);
  --adp-color-other-month: color-mix(in srgb, var(--text) 32%, transparent); --adp-color-other-month-hover: var(--text-3); --adp-color-disabled: color-mix(in srgb, var(--text) 28%, transparent); --adp-color-disabled-in-range: var(--text-3);

/* ---------- sessions: list | conversation | inspector ---------- */

}

@property --pane { syntax: "<color>"; inherits: true; initial-value: transparent; }

.side { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--bg-side); border-right: 1px solid var(--border); }

.row-main { display: flex; flex-direction: column; min-width: 0; gap: 1px; }

#more, #newer { display: flex; align-items: center; gap: 6px; margin: 0 auto 14px; height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border-2); background: var(--bg-raised); color: var(--text-2); font-size: var(--fs-xs); }
#newer { margin: 18px auto 0; }

#more:hover, #newer:hover { background: var(--hover); color: var(--text); }

.ev { position: relative; }

.bubble { max-width: 84%; padding: 10px 14px; border-radius: 16px 16px 5px 16px; background: var(--active); color: var(--text); font-size: var(--fs-base); line-height: 1.6; white-space: pre-wrap; word-break: break-word; box-shadow: inset 0 0 0 1px var(--border); }

.md { word-break: break-word; color: var(--text); }

/* collapsible rows: reasoning, tools, notices */

.st-ok { color: var(--ok); display: flex; } .st-err { color: var(--danger); display: flex; } .st-none { color: var(--text-3); font-size: var(--fs-2xs); }

.spin { width: 12px; height: 12px; border-radius: 50%; border: 1.6px solid var(--work-bg); border-top-color: var(--work); animation: spin .8s linear infinite; flex: none; }
.tool-body { padding: 2px 12px 12px 43px; display: grid; gap: 8px; }

.k-turn_start { display: none; }
.k-turn_end { display: flex; justify-content: flex-end; margin: 14px 0 6px !important; padding: 2px 2px 10px; border-bottom: 1px dashed var(--border-2); font-size: var(--fs-2xs); color: var(--text-3); font-variant-numeric: tabular-nums; }
.k-turn_end > span { min-width: 0; overflow-wrap: anywhere; text-align: right; }
.k-usage { display: none; }   /* summed onto the turn divider instead */
.shimmer { background: linear-gradient(90deg, var(--work) 0%, color-mix(in srgb, var(--work) 35%, var(--text-3)) 40%, var(--work) 80%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shim 2.2s linear infinite; font-weight: 500; }
.empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-3); text-align: center; padding: 24px; }
.empty svg { width: 36px; height: 36px; opacity: .7; }
.empty h3 { margin: 4px 0 0; font-size: var(--fs-base); font-weight: 500; color: var(--text-2); }
.empty p { margin: 0; font-size: var(--fs-sm); }
.keys { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 14px; margin-top: 8px; font-size: var(--fs-xs); color: var(--text-3); }
.keys span { display: inline-flex; gap: 5px; align-items: center; }
.sk { border-radius: var(--r-sm); background: linear-gradient(90deg, var(--hover) 25%, var(--active) 50%, var(--hover) 75%); background-size: 200% 100%; animation: sk 1.2s linear infinite; }

/* inspector */
.inspector { min-height: 0; overflow: auto; background: var(--bg-side); border-left: 1px solid var(--border); padding: 6px 0 24px; }
.insp-sec { padding: 16px 18px; border-bottom: 1px solid var(--border); }
.insp-sec:last-child { border-bottom: 0; }
.insp-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; font-size: var(--fs-xs); font-weight: 600; color: var(--text-2); }
.insp-h .ok { color: var(--ok); font-weight: 500; font-variant-numeric: tabular-nums; }
.insp-h .ok.bad { color: var(--danger); }
.insp-empty { padding: 24px 18px; font-size: var(--fs-sm); color: var(--text-3); }
.us-cost b { display: block; font-size: var(--fs-2xl); font-weight: 650; letter-spacing: -.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.us-cost span { display: block; margin-top: 4px; font-size: var(--fs-xs); color: var(--text-3); }
.us-cost .warn { color: var(--warn); }
.stackbar { display: flex; height: 6px; gap: 2px; margin: 14px 0 12px; border-radius: 3px; overflow: hidden; background: var(--hover); }
.stackbar i { display: block; min-width: 3px; }
.us-tok { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin: 0; }
.us-tok dt { display: flex; align-items: center; gap: 6px; font-size: var(--fs-2xs); color: var(--text-3); }
.us-tok dd { margin: 1px 0 0; font-size: var(--fs-sm); font-weight: 500; font-variant-numeric: tabular-nums; }
.sw { display: inline-block; width: 8px; height: 8px; border-radius: 2.5px; flex: none; }
.meter { height: 6px; border-radius: 3px; background: var(--hover); box-shadow: inset 0 0 0 1px var(--border); overflow: hidden; margin-bottom: 6px; }
.meter > i { display: block; height: 100%; min-width: 2px; border-radius: 3px; background: linear-gradient(90deg, var(--accent-solid), var(--accent)); }
.meter.warn > i { background: linear-gradient(90deg, var(--warn), color-mix(in srgb, var(--warn) 60%, var(--danger))); }
.meter.bad > i { background: linear-gradient(90deg, var(--warn), var(--danger)); }
.cmd { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 10px; border-radius: 8px; background: var(--code-bg); border: 1px solid var(--border-2); font-size: 11.5px; color: var(--text-2); }
.cmd > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmd-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.insp-note { margin: 8px 0 0; font-size: var(--fs-xs); color: var(--warn); }
.kv { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 9px 10px; margin: 0; font-size: var(--fs-xs); }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; color: var(--text); min-width: 0; overflow-wrap: anywhere; }
.kv dd.mono { font-size: 11.5px; }
.kv .key { cursor: copy; border-bottom: 1px dashed var(--border-strong); }
.live-pid { display: inline-flex; align-items: center; gap: 6px; color: var(--work); font-variant-numeric: tabular-nums; }
.sub-row { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 8px; border: 0; border-radius: 7px; background: none; font-size: var(--fs-xs); text-align: left; color: var(--text-2); }
.sub-row:hover { background: var(--hover); color: var(--text); }
.sub-row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub-row svg.i { width: 14px; height: 14px; color: var(--text-3); }

/* ---------- pages ---------- */
.view { min-height: 0; min-width: 0; overflow-y: auto; overflow-x: hidden; position: relative; }
.page { --pad: 36px; max-width: 1240px; margin: 0 auto; padding: 32px var(--pad) 96px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.page > * { min-width: 0; }
.page.narrow { max-width: 920px; }
.page-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px 24px; flex-wrap: wrap; }
.page-h h1 { margin: 0; font-size: var(--fs-xl); font-weight: 650; letter-spacing: -.02em; }
.page-h p { margin: 6px 0 0; max-width: 680px; color: var(--text-3); font-size: var(--fs-sm); }
.page-h p b { color: var(--text-2); font-weight: 600; }
.page-h code { font-size: .88em; padding: .1em .38em; border-radius: 4px; background: var(--hover); border: 1px solid var(--border); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
.toolbar > .grow { min-width: 0; }
.toolbar.sticky { position: sticky; top: 0; z-index: 4; margin: -8px calc(-1 * var(--pad)) 0; padding: 10px var(--pad); background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(12px) saturate(1.4); }
.card { background: var(--panel); border: 1px solid var(--border-2); border-radius: var(--r-xl); box-shadow: var(--shadow-card); padding: 18px 20px; min-width: 0; }
.card.flush { padding: 0; overflow: hidden; }
.card-h { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 14px; }
.card-h > div:first-child { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.card-h h2 { margin: 0; font-size: var(--fs-md); font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
.card-h .sub { font-size: var(--fs-xs); color: var(--text-3); }
.h-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* usage: one hero tile, one hairline-split grid */
.kpi-board { display: grid; grid-template-columns: minmax(300px, 1.15fr) 2fr; gap: 14px; }
.kpi { position: relative; display: flex; flex-direction: column; padding: 16px 18px; min-width: 0; }
.kpi-l { font-size: var(--fs-xs); color: var(--text-3); font-weight: 500; white-space: nowrap; }
.kpi-v { margin-top: 6px; font-size: 22px; font-weight: 650; letter-spacing: -.02em; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.kpi-f { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: var(--fs-xs); color: var(--text-3); min-height: 18px; }
.kpi.hero { background: radial-gradient(120% 140% at 100% 0%, var(--hero-glow), transparent 55%), var(--panel); border: 1px solid var(--border-2); border-radius: var(--r-xl); box-shadow: var(--shadow-card); padding: 20px 22px; overflow: hidden; }
.kpi.hero .kpi-v { font-size: 34px; letter-spacing: -.035em; }
.delta { font-weight: 600; font-variant-numeric: tabular-nums; padding: 1px 7px; border-radius: 999px; }
.delta.up { color: var(--warn); background: var(--warn-bg); }
.delta.down { color: var(--ok); background: var(--work-bg); }
.spark { position: absolute; right: 18px; top: 22px; width: min(180px, 40%); height: 44px; }
.spark .line { fill: none; stroke: var(--accent); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.spark .area { fill: url(#spark-fill); }
.kpi-warn { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; padding: 5px 10px; border: 0; border-radius: 7px; font-size: var(--fs-xs); font-weight: 500; color: var(--warn); background: var(--warn-bg); }
.kpi-warn svg.i { width: 13px; height: 13px; }
.kpi-warn:hover { background: color-mix(in srgb, var(--warn-bg) 100%, var(--warn) 10%); }
.kpi-ok { margin-top: 14px; font-size: var(--fs-xs); color: var(--text-3); }
.kpi.hero .kpi-warn, .kpi.hero .kpi-ok { margin-top: auto; }
.kpi.hero .kpi-f { margin-bottom: 14px; }
.kpi-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--panel); border: 1px solid var(--border-2); border-radius: var(--r-xl); box-shadow: var(--shadow-card); overflow: hidden; }
.kpi-grid .kpi { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.kpi-grid .kpi:nth-child(3n) { border-right: 0; }
.kpi-grid .kpi:nth-child(n+4) { border-bottom: 0; }
.unpriced-list { display: grid; }
.unpriced-list .ur { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 16px; padding: 8px 0; border-top: 1px solid var(--border); font-size: var(--fs-sm); }
.unpriced-list .ur:first-child { border-top: 0; }
.unpriced-list .ur .mono { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: -4px 0 10px; font-size: var(--fs-xs); color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { width: 8px; height: 8px; border-radius: 2.5px; flex: none; }
.legend b { font-weight: 500; color: var(--text-3); font-variant-numeric: tabular-nums; }
.legend .hi { width: 13px; height: 13px; color: light-dark(oklch(.42 .11 var(--h, 250)), oklch(.86 .09 var(--h, 250))); }
.chart { position: relative; min-height: 240px; }
.chart:focus-visible { outline-offset: 4px; border-radius: var(--r-lg); }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart text { font: 11px var(--font-sans); fill: var(--text-3); font-variant-numeric: tabular-nums; }
.chart .grid { stroke: var(--grid); stroke-dasharray: 2 3; }
.chart .base { stroke: var(--border-strong); }
.chart .band { fill: transparent; }
.chart .band.on { fill: var(--hover); }
.chart-empty { display: grid; place-items: center; height: 230px; font-size: var(--fs-sm); color: var(--text-3); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin: -6px 0 8px; font-size: var(--fs-sm); min-width: 0; }
.crumbs button { border: 0; background: none; height: 26px; padding: 0 6px; border-radius: var(--r-sm); color: var(--text-2); font-family: var(--font-mono); font-size: 12.5px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumbs button:hover { background: var(--hover); color: var(--text); }
.crumbs button[aria-current=page] { color: var(--text); font-weight: 600; }
.crumbs .sep { color: var(--text-3); }
.table-wrap { overflow-x: auto; min-width: 0; margin: 0 -20px -18px; }
.card.flush .table-wrap { margin: 0; }
.dt { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); font-variant-numeric: tabular-nums; }
.dt th, .dt td { padding: 0 14px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--border); }
.dt th { height: 36px; font-size: var(--fs-xs); font-weight: 500; color: var(--text-3); background: var(--panel); border-bottom-color: var(--border-2); }
.dt td { height: 44px; }
.dt th:first-child, .dt td:first-child { text-align: left; padding-left: 20px; }
.dt th:last-child, .dt td:last-child { padding-right: 20px; }
.dt th.l, .dt td.l { text-align: left; }
.dt th button { border: 0; background: none; padding: 2px 0; color: inherit; font: inherit; display: inline-flex; align-items: center; gap: 4px; }
.dt th button:hover { color: var(--text); }
.dt th[aria-sort] button { color: var(--text); }
.dt th .arrow { font-size: 9px; opacity: .9; }
.dt tbody tr { transition: background var(--dur); }
.dt tbody tr:hover { background: var(--hover); }
.dt td.name { max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
.dt td .cellname { display: inline-flex; align-items: center; gap: 10px; min-width: 0; max-width: 100%; vertical-align: middle; }
.dt td .cellname > span { overflow: hidden; text-overflow: ellipsis; }
.dt td .sub2 { margin-left: 2px; font: var(--fs-2xs) var(--font-mono); color: var(--text-3); }
.dt td.cost { font-weight: 600; }
.dt td.cost .share { display: inline-block; vertical-align: middle; width: 64px; height: 4px; margin-right: 12px; border-radius: 2px; background: var(--hover); overflow: hidden; }
.dt td.cost .share i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
.dt td.dim { color: var(--text-3); }
.dt td.warnc { color: var(--warn); }
.dt tfoot td { font-weight: 600; border-bottom: 0; background: var(--hover); }
.dt .linkish { border: 0; background: none; padding: 0; color: var(--text); font: inherit; text-align: left; cursor: pointer; overflow: hidden; text-overflow: ellipsis; }
.dt .linkish:hover { color: var(--accent); }
.dt .tw { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; margin-right: 2px; border: 0; border-radius: var(--r-sm); background: none; color: var(--text-3); flex: none; }
.dt .tw:hover { background: var(--hover); color: var(--text); }
.dt .tw svg { transition: transform var(--dur) var(--ease); }
.dt .tw[aria-expanded=true] svg { transform: rotate(90deg); }
.dt .tw.blank { visibility: hidden; }
.dt .ck { width: 44px; padding-right: 0; }
.dt tbody tr:has(.cb:checked) { background: var(--accent-bg); }
#m-table tbody tr[data-key] { cursor: pointer; }
.mini { display: inline-block; width: 44px; height: 4px; margin-left: 8px; vertical-align: middle; border-radius: 999px; background: var(--hover); overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--accent); }
.tip { position: fixed; z-index: 80; pointer-events: none; min-width: 170px; padding: 9px 11px; border-radius: 9px; background: var(--bg-overlay); box-shadow: var(--shadow-pop); font-size: var(--fs-xs); color: var(--text-2); }
.tip h4 { margin: 0 0 6px; padding-bottom: 6px; border-bottom: 1px solid var(--border); font-size: var(--fs-xs); font-weight: 600; color: var(--text); }
.tip div { display: flex; align-items: center; gap: 7px; justify-content: space-between; line-height: 1.8; }
.tip div > span { display: inline-flex; align-items: center; gap: 7px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tip i { width: 8px; height: 8px; border-radius: 2.5px; flex: none; }
.tip b { font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; }
.tip .tot { margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--border); }
.tip p { margin: 0; }

/* search */
.search-hero h1 { padding-top: 10px; }
.big-search { display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 7px 7px 7px 16px; border-radius: 14px; background: var(--bg-raised); border: 1px solid var(--border-2); box-shadow: 0 6px 24px -12px rgba(0, 0, 0, .25), var(--shadow-card); transition: border-color var(--dur), box-shadow var(--dur); }
.big-search:focus-within { border-color: var(--accent-border); box-shadow: 0 0 0 4px var(--accent-bg), 0 6px 24px -12px rgba(0, 0, 0, .25); }
.big-search > svg.i { width: 19px; height: 19px; color: var(--text-3); }
.big-search input { border: 0; outline: 0; background: none; min-width: 0; color: var(--text); }
.big-search input::placeholder { color: var(--text-3); }
.big-search input::-webkit-search-cancel-button { filter: grayscale(1); }
#s-q { flex: 1.6 1 0; font-size: var(--fs-md); }
#s-f { flex: 1 1 0; font-size: var(--fs-xs); }
.big-search .divider { width: 1px; height: 24px; background: var(--border-2); flex: none; }
.big-search .btn { height: 40px; padding: 0 18px; border-radius: 10px; }
.hint-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: var(--fs-xs); }
.hint-row .chip { height: 24px; font-family: var(--font-mono); font-size: 11.5px; }
#s-index:empty { display: none; }
#s-index .notice { align-items: center; }
#s-index .grow { flex: 1; min-width: 0; }
#s-index > .status-line { display: inline-flex; align-items: center; gap: 7px; }
#s-index > .status-line::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.pbar { height: 4px; margin-top: 6px; border-radius: 2px; background: var(--hover); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--accent-solid); transition: width var(--dur); }
#s-status { font-size: var(--fs-sm); }
.sres { display: flex; flex-direction: column; gap: 12px; }
.sgroup { border: 1px solid var(--border-2); border-radius: var(--r-xl); background: var(--panel); box-shadow: var(--shadow-card); overflow: hidden; }
.sgroup-h { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); min-width: 0; }
.sgroup-h .t { flex: 1; min-width: 0; }
.sgroup-h .t b { display: block; font-size: var(--fs-sm); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sgroup-h .t span { display: block; margin-top: 1px; font: var(--fs-2xs) var(--font-mono); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sgroup-h .age { font-size: var(--fs-xs); color: var(--text-3); white-space: nowrap; }
.hit { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 12px; align-items: baseline; width: 100%; padding: 9px 16px; border: 0; border-top: 1px solid var(--border); background: none; text-align: left; color: var(--text-2); font-size: var(--fs-sm); line-height: 1.6; transition: background var(--dur); }
.hit:first-of-type { border-top: 0; }
.hit:hover { background: var(--hover); color: var(--text); }
.kind { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-2xs); font-weight: 500; color: var(--text-3); white-space: nowrap; }
.kind::before { content: ""; width: 6px; height: 6px; border-radius: 2px; background: var(--c-other); flex: none; }
.kind.kd-user_message::before { background: var(--accent); } .kind.kd-assistant_message::before { background: var(--c3); } .kind.kd-reasoning::before { background: var(--c5); }
.kind.kd-tool_call::before, .kind.kd-tool_result::before { background: var(--c2); }
.hit .snip { overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.hit .ts { font-size: var(--fs-2xs); color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
mark { background: var(--mark); color: var(--mark-text); border-radius: 3px; padding: 0 2px; }
#s-more { align-self: center; }
.shome { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.hcol { display: grid; gap: 14px; min-width: 0; }
.hcard { background: var(--panel); border: 1px solid var(--border-2); border-radius: var(--r-xl); box-shadow: var(--shadow-card); padding: 16px 18px 14px; min-width: 0; }
.hcard h2 { margin: 0 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: var(--fs-sm); font-weight: 600; }
.hcard h2 small { font-size: var(--fs-xs); font-weight: 400; color: var(--text-3); }
.hcard h2 .live { display: inline-flex; align-items: center; gap: 7px; }
.hcard h2 .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--work); animation: pulse 1.8s var(--ease) infinite; }
.hrows { display: grid; margin: 0 -8px; }
.hrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 7px 8px; border: 0; border-radius: var(--r-md); background: none; text-align: left; color: var(--text); }
.hrow:hover { background: var(--hover); }
.hrow .t { min-width: 0; }
.hrow .t b { display: block; font-size: var(--fs-sm); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hrow .t span { display: block; font: var(--fs-2xs) var(--font-mono); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hrow .age { font-size: var(--fs-xs); color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.hrow .age.work { color: var(--work); }
.hnone { margin: 0; padding: 8px 0; font-size: var(--fs-sm); color: var(--text-3); }
.hchips { display: flex; flex-wrap: wrap; gap: 6px; }
.hchips .chip { font-family: var(--font-mono); }
.hsyn { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 9px 16px; margin: 0; font-size: var(--fs-sm); }
.hsyn dt, .hsyn dd { margin: 0; }
.hsyn dd { color: var(--text-3); }
.hstats { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.hstats div { display: flex; flex-direction: column; gap: 2px; padding: 9px 12px; background: var(--panel); }
.hstats b { font-size: var(--fs-md); font-weight: 600; font-variant-numeric: tabular-nums; }
.hstats span { font-size: var(--fs-2xs); color: var(--text-3); }
.hcard .hint { margin: 10px 0 0; font-size: var(--fs-xs); color: var(--text-3); }

/* manage */
.subtabs { display: flex; gap: 22px; border-bottom: 1px solid var(--border-2); }
.subtabs button { position: relative; display: inline-flex; align-items: center; height: 38px; padding: 0; border: 0; background: none; font-size: var(--fs-sm); font-weight: 500; color: var(--text-3); }
.subtabs button:hover { color: var(--text); }
.subtabs button[aria-selected=true] { color: var(--text); }
.subtabs button[aria-selected=true]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }
.review, #m-list-pane, #m-archive-pane { display: flex; flex-direction: column; gap: 12px; }
.bulkbar { position: fixed; left: calc(50% + var(--rail-w) / 2); bottom: 22px; z-index: 20; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; width: min(620px, calc(100vw - var(--rail-w) - 32px)); padding: 8px 8px 8px 18px; border-radius: 14px; background: #1f1f24; color: #c8c8ce; box-shadow: 0 18px 50px -12px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .08); font-size: var(--fs-sm); animation: rise .2s var(--ease); }
.bulkbar b { color: #fff; }
.bulkbar .btn.on-dark { color: #c8c8ce; } .bulkbar .btn.on-dark:hover { background: rgba(255, 255, 255, .08); color: #fff; }
.plan-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border-2); border-radius: var(--r-xl); overflow: hidden; }
.plan-kpis .kpi { background: var(--panel); }
.plan-kpis .kpi > span { font-size: var(--fs-xs); color: var(--text-3); }
.plan-kpis .kpi > b { margin-top: 4px; font-size: 22px; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.plan-kpis .kpi > small { margin-top: 4px; font-size: var(--fs-xs); color: var(--text-3); }
.rlist { display: grid; margin: -6px -20px -18px; }
.ritem { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 20px; border-top: 1px solid var(--border); font-size: var(--fs-sm); min-width: 0; }
.ritem:first-child { border-top: 0; }
.ritem .t { min-width: 0; }
.ritem .t b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ritem .t span { display: block; font-size: var(--fs-2xs); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ritem .r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; font-size: var(--fs-xs); color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.confirm-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }

/* insights */
.stat-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--panel); border: 1px solid var(--border-2); border-radius: var(--r-xl); box-shadow: var(--shadow-card); overflow: hidden; }
.stat { display: flex; flex-direction: column; gap: 4px; padding: 14px 18px; border: 0; border-right: 1px solid var(--border); background: none; text-align: left; font-size: var(--fs-xs); color: var(--text-3); min-width: 0; }
.stat:last-child { border-right: 0; }
.stat b { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -.015em; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
button.stat { cursor: pointer; transition: background var(--dur); }
button.stat:hover { background: var(--hover); } button.stat:hover b { color: var(--accent); }
button.stat:focus-visible { outline-offset: -2px; }
.heat-wrap { overflow-x: auto; }
.heat-wrap svg, .punch svg { display: block; }
.heat-wrap text, .punch text { font: 11px var(--font-sans); fill: var(--text-3); }
rect.cell { cursor: pointer; transition: opacity var(--dur); }
.l0 { fill: var(--heat-0); } .l1 { fill: var(--heat-1); } .l2 { fill: var(--heat-2); } .l3 { fill: var(--heat-3); } .l4 { fill: var(--heat-4); }
rect.cell:hover { stroke: var(--text); stroke-width: 1.2px; }
rect.cell.sel { stroke: var(--accent); stroke-width: 2px; }
.scale { display: inline-flex; align-items: center; gap: 3px; font-size: var(--fs-2xs); color: var(--text-3); }
.scale span { margin: 0 4px; }
.scale i { width: 11px; height: 11px; border-radius: 3px; }
.punch { overflow-x: auto; }
.punch .mbar { fill: var(--heat-3); }
.ranks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; }
.rank h3 { margin: 0 0 6px; font-size: var(--fs-xs); font-weight: 600; color: var(--text-3); }
.rank ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.rank li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; grid-template-rows: auto 4px; align-items: center; column-gap: 8px; margin: 0 -8px; padding: 5px 8px; border-radius: var(--r-md); font-size: var(--fs-sm); cursor: pointer; transition: background var(--dur), opacity var(--dur); }
.rank li:hover { background: var(--hover); }
.rank li.on { background: var(--accent-bg); box-shadow: inset 0 0 0 1px var(--accent-border); }
.rank li.dim { opacity: .5; } .rank li.dim:hover { opacity: .85; }
.rank li .n { font-size: var(--fs-2xs); color: var(--text-3); }
.rank li .nm { display: inline-flex; align-items: center; gap: 7px; min-width: 0; overflow: hidden; white-space: nowrap; }
.rank li .nm > span:last-child { overflow: hidden; text-overflow: ellipsis; }
.rank li .v { font-weight: 500; font-variant-numeric: tabular-nums; }
.rank li .rb { grid-column: 2 / 4; height: 4px; margin-top: 4px; border-radius: 2px; background: var(--hover); overflow: hidden; }
.rank li .rb i { display: block; height: 100%; border-radius: 2px; background: var(--accent); opacity: .85; }
.rank .none { font-size: var(--fs-sm); color: var(--text-3); }
.pop { position: fixed; z-index: 55; width: min(320px, calc(100vw - 16px)); max-height: calc(100dvh - 16px); overflow: auto; background: var(--bg-overlay); border-radius: 12px; box-shadow: var(--shadow-pop); font-size: var(--fs-xs); color: var(--text-2); animation: pop .14s var(--ease); }
.pop-h { display: flex; align-items: flex-start; gap: 8px; padding: 12px 10px 10px 14px; }
.pop-h > div { flex: 1; min-width: 0; }
.pop-h h3 { margin: 0; font-size: var(--fs-sm); font-weight: 600; color: var(--text); letter-spacing: -.01em; }
.pop-h p { margin: 3px 0 0; color: var(--text-3); }
.pop-h .icon-btn { margin: -3px -2px 0 0; }
.pop-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; margin: 0 10px; border-radius: 9px; overflow: hidden; background: var(--border); border: 1px solid var(--border); }
.pop-kpis > div { display: flex; flex-direction: column; gap: 2px; padding: 7px 8px; background: var(--bg-overlay); min-width: 0; }
.pop-kpis span { font-size: var(--fs-2xs); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pop-kpis b { font-size: var(--fs-sm); font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.pop-kpis > .on { background: color-mix(in srgb, var(--accent) 10%, var(--bg-overlay)); }
.pop-kpis > .on span { color: var(--accent); }
.pop-sec { padding: 12px 14px 0; }
.pop-sec h5 { display: flex; justify-content: space-between; margin: 0 0 7px; font-size: var(--fs-2xs); font-weight: 600; color: var(--text-3); letter-spacing: .02em; }
.pop-sec h5 .muted { font-weight: 400; }
.pop-bar { display: flex; gap: 2px; height: 6px; margin-bottom: 6px; border-radius: 3px; overflow: hidden; }
.pop-bar i { display: block; min-width: 2px; }
.pop-row { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto 34px; align-items: center; gap: 8px; padding: 3px 0; }
.pop-row b { color: var(--text); font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.pop-row > .muted { text-align: right; font-variant-numeric: tabular-nums; }
.pop-row .rn { display: inline-flex; align-items: center; gap: 7px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.pop-sess { display: flex; align-items: center; gap: 8px; width: calc(100% + 12px); margin: 0 -6px; padding: 5px 6px; border: 0; border-radius: var(--r-md); background: none; text-align: left; color: var(--text); transition: background var(--dur); }
.pop-sess:hover { background: var(--hover); }
.pop-sess .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: var(--fs-xs); }
.pop-sess .m { color: var(--text-3); font-size: var(--fs-2xs); font-variant-numeric: tabular-nums; }
.pop-more, .pop-wait { margin: 4px 0 0; color: var(--text-3); }
.pop-empty { display: flex; align-items: center; gap: 8px; margin: 0 10px; padding: 14px 12px; border-radius: 9px; background: var(--hover); color: var(--text-3); }
.pop-f { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 8px 10px 8px 14px; border-top: 1px solid var(--border); }
.pop-f .keys { display: inline-flex; align-items: center; gap: 3px; margin: 0; color: var(--text-3); font-size: var(--fs-2xs); white-space: nowrap; }
.pop-f .keys kbd { min-width: 16px; height: 16px; padding: 0 3px; font-size: 9.5px; }
.pop-f .grow { flex: 1; }

/* ---------- overlays ---------- */
.menu { position: fixed; z-index: 60; min-width: 240px; max-width: min(420px, calc(100vw - 24px)); padding: 5px; border-radius: 10px; background: var(--bg-overlay); box-shadow: var(--shadow-pop); animation: pop .14s var(--ease); }
.menu .cmd { margin: 2px 2px 6px; display: block; padding: 7px 9px; font: 11.5px/1.5 var(--font-mono); word-break: break-all; max-height: 96px; overflow: auto; }
.menu button { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 32px; padding: 0 9px; border: 0; border-radius: 6px; background: none; font-size: var(--fs-sm); text-align: left; color: var(--text); }
.menu button svg.i { color: var(--text-3); }
.menu button:hover:not(:disabled), .menu button:focus-visible { background: var(--hover); outline: none; }
.menu button:disabled { color: var(--text-3); }
.menu .sep { height: 1px; margin: 4px 2px; background: var(--border); }
.menu p { margin: 4px 9px 6px; font-size: var(--fs-xs); color: var(--text-3); line-height: 1.5; }
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .35); backdrop-filter: blur(2px); animation: fade .2s var(--ease); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 41; width: 440px; max-width: 100vw; display: flex; flex-direction: column; background: var(--bg-side); border-left: 1px solid var(--border-2); box-shadow: var(--shadow-pop); transform: translateX(100%); transition: transform .22s var(--ease); }
.drawer.in { transform: none; }
.drawer-h { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 12px 20px; border-bottom: 1px solid var(--border); }
.drawer-h h2 { margin: 0; font-size: var(--fs-md); font-weight: 600; }
.drawer-b { flex: 1; overflow: auto; }
.d-sec { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
.d-sec:last-child { border-bottom: 0; }
.d-sec .insp-h { margin: 0; }
.d-conn { display: flex; align-items: center; gap: 12px; min-width: 0; }
.d-conn > div { min-width: 0; }
.d-conn b { font-size: var(--fs-sm); }
#m-api { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.d-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--border); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
.d-stats.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.d-stats > div { display: flex; flex-direction: column; gap: 2px; padding: 9px 12px; background: var(--bg-side); font-size: var(--fs-2xs); color: var(--text-3); min-width: 0; }
.d-stats b { font-size: var(--fs-md); font-weight: 600; color: var(--text); white-space: nowrap; font-variant-numeric: tabular-nums; }
.d-stats b small { margin-left: 2px; font-size: var(--fs-2xs); font-weight: 400; color: var(--text-3); }
.d-stats .bad b { color: var(--danger); }
.d-spark svg { width: 100%; height: 14px; margin-top: 2px; }
.d-spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.chk { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto 16px; align-items: center; gap: 8px; height: 30px; font-size: var(--fs-xs); border-bottom: 1px solid var(--border); }
.chk:last-child { border-bottom: 0; }
.mth { justify-self: start; font: 600 10px/1 var(--font-mono); padding: 3px 6px; border-radius: 4px; background: var(--hover); color: var(--text-2); }
.mth.m-sse, .mth.m-ws, .mth.m-ndjson { color: var(--accent); background: var(--accent-bg); }
.pth { font: 11.5px var(--font-mono); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chk .ms { font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; text-align: right; }
.chk .ms.slow { color: var(--warn); }
.chk .ic { display: flex; justify-content: center; }
.chk .ic svg.i { width: 13px; height: 13px; stroke-width: 2.2; }
.chk[data-ok=true] .ic { color: var(--ok); } .chk[data-ok=false] .ic { color: var(--danger); }
#ticker { font: 11.5px/1.7 var(--font-mono); max-height: 280px; overflow: auto; }
.tk { display: grid; grid-template-columns: 62px 7px minmax(0, 1fr); gap: 8px; align-items: center; white-space: nowrap; animation: slide 150ms var(--ease); }
.tk time { color: var(--text-3); }
.tk i { width: 5px; height: 5px; border-radius: 50%; background: var(--text-3); }
.tk.t-event i { background: var(--work); } .tk.t-session i { background: var(--accent); } .tk.t-removed i, .tk.t-lagged i { background: var(--danger); }
.tk span { overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }
.tk span em { font-style: normal; color: var(--text-3); }
.tk-empty { margin: 0; font: var(--fs-xs)/1.6 var(--font-sans); color: var(--text-3); }
.palette { position: fixed; inset: 0; z-index: 70; display: flex; justify-content: center; padding-top: 14vh; background: rgba(0, 0, 0, .35); backdrop-filter: blur(3px); }
.palette-box { width: min(600px, calc(100vw - 32px)); max-height: 480px; display: flex; flex-direction: column; align-self: flex-start; background: var(--bg-overlay); border-radius: 14px; box-shadow: var(--shadow-pop); overflow: hidden; animation: pop .14s var(--ease); }
.palette-in { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px 0 16px; border-bottom: 1px solid var(--border); color: var(--text-3); }
.palette-in input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: var(--fs-md); color: var(--text); }
.palette-in input::placeholder { color: var(--text-3); }
.palette-in svg.i { width: 18px; height: 18px; }
.palette-list { overflow: auto; padding: 6px; }
.pal-g { padding: 8px 10px 4px; font-size: var(--fs-2xs); font-weight: 600; color: var(--text-3); }
.pal-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 38px; padding: 0 10px; border: 0; border-radius: 8px; background: none; font-size: var(--fs-sm); text-align: left; color: var(--text); }
.pal-item > svg.i { width: 16px; height: 16px; color: var(--text-3); }

.pal-item .pt { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-item .ps { flex: 1; min-width: 0; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-xs); color: var(--text-3); }
.pal-item kbd { margin-left: auto; }
.pal-none { padding: 14px; text-align: center; color: var(--text-3); font-size: var(--fs-sm); }
.palette-f { display: flex; gap: 16px; padding: 9px 16px; border-top: 1px solid var(--border); font-size: var(--fs-2xs); color: var(--text-3); }
.palette-f span { display: inline-flex; align-items: center; gap: 4px; }
#toasts { position: fixed; right: 20px; bottom: 20px; z-index: 90; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none; }
.toast { max-width: 420px; padding: 10px 14px; border-radius: 11px; background: var(--bg-overlay); box-shadow: var(--shadow-pop); font-size: var(--fs-sm); color: var(--text); animation: pop .18s var(--ease); }

/* api explorer */
.a-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.a-grid { display: grid; grid-template-columns: 284px minmax(0, 1fr); gap: 18px; align-items: start; }

.a-find .input { width: 100%; }
.a-list { overflow-y: auto; padding: 2px 6px 10px; }
.a-gh { margin: 12px 8px 4px; font-size: var(--fs-2xs); font-weight: 600; color: var(--text-3); }
.a-ep { display: grid; grid-template-columns: 52px minmax(0, 1fr); align-items: center; gap: 1px 8px; width: 100%; padding: 6px 8px; border: 0; border-radius: var(--r-md); background: none; text-align: left; color: var(--text-2); }
.a-ep:hover { background: var(--hover); color: var(--text); }
.a-ep[aria-current=true] { background: var(--active); color: var(--text); }
.a-ep .mth { justify-self: start; }

.a-ep .nm { grid-column: 2; font-size: var(--fs-2xs); color: var(--text-3); }
.a-none { margin: 16px 8px; font-size: var(--fs-xs); color: var(--text-3); }
.mth.m-get { color: var(--work); background: var(--work-bg); }
.mth.m-post { color: var(--warn); background: var(--warn-bg); }
.mth.m-delete { color: var(--danger); background: var(--danger-bg); }
.a-main { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.a-main .card-h code { font-size: .92em; padding: .1em .4em; border-radius: 4px; background: var(--hover); border: 1px solid var(--border); }
.btn kbd { margin-left: 4px; padding: 0 4px; border-radius: 4px; font-size: 10.5px; line-height: 16px; background: rgba(0, 0, 0, .22); color: inherit; }
.a-line { display: flex; align-items: center; gap: 10px; min-width: 0; }
.a-line .mth { font-size: 11px; padding: 4px 7px; }
.a-path { font: 600 var(--fs-md) var(--font-mono); letter-spacing: -.01em; overflow-wrap: anywhere; }
.a-path i { font-style: normal; color: var(--accent); }
.a-desc { margin: 8px 0 0; color: var(--text-3); font-size: var(--fs-sm); line-height: 1.6; }
#a-req .notice { margin-top: 12px; }
.a-noparam { margin: 14px 0 0; font-size: var(--fs-sm); color: var(--text-3); }
.a-params { display: grid; grid-template-columns: 148px minmax(0, 1fr); gap: 12px 16px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); align-items: start; }
.a-pn { padding-top: 6px; font: 12.5px var(--font-mono); color: var(--text); overflow-wrap: anywhere; }
.a-pn .req { margin-left: 6px; font: 600 10px var(--font-sans); color: var(--danger); }
.a-pn .loc { display: block; margin-top: 3px; font: 11px var(--font-sans); color: var(--text-3); }
.a-pc { min-width: 0; }
.a-pc > .input { width: 100%; font-size: 12.5px; }
.a-pc .hint { margin-top: 4px; font-size: var(--fs-2xs); color: var(--text-3); }
.a-body { height: auto; min-height: 92px; padding: 8px 10px; line-height: 1.55; resize: vertical; }
.a-url { display: flex; align-items: center; gap: 8px; margin-top: 16px; padding: 6px 6px 6px 12px; border: 1px solid var(--border-2); border-radius: var(--r-md); background: var(--code-bg); min-width: 0; }
.a-url .mono { flex: 1; min-width: 0; font-size: 12px; color: var(--text-2); overflow-wrap: anywhere; }
.a-tok { flex: none; font-size: var(--fs-2xs); color: var(--text-3); }
.a-snip { margin: 12px 0 0; }
.a-snip .seg button { font-family: var(--font-sans); }
.a-snip pre { max-height: 300px; }
.a-meta { display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap; font-size: var(--fs-xs); color: var(--text-3); font-variant-numeric: tabular-nums; }

// ---------------------------------------------------------------- synthetic session
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const R = (a, b) => Math.round(a + rnd() * (b - a));
const PRICE = { "claude-opus-5-5": { in: 5, cr: 0.5, cw: 6.25, out: 25 }, "claude-haiku-5-5": { in: 1, cr: 0.1, cw: 1.25, out: 5 } };
const T0 = new Date("2026-10-30T08:41:05").getTime();
const PROMPTS = [
  "中转站管理后台加载很慢，模型列表也和上游不同步，查一下原因并修复",
  "预发布部署在门禁这一步失败了，看看是哪个测试，修好后重新部署预发布",
  "把模型列表同步改成后台定时任务，并补上回归测试",
];
const TOOLS = [
  ["Bash", "grep -rn \"listModels\" src/ --include=*.ts | head -40"], ["Read", "src/server/routes/models.ts"], ["Bash", "node scripts/bench-admin.mjs --runs 5"],

  ["Write", "/tmp/crosery-perf/api-verify-0333.mjs"], ["Bash", "tail -4 /tmp/crosery-perf/deploy-preview-0333.log"], ["Read", "src/jobs/sync-models.ts"],

  let t = T0, ctx = 38000, n = 0;

        for (let k = 0; k < nt; k++) {
          const [name, arg] = TOOLS[R(0, TOOLS.length - 1)];
          const d = name === "Bash" ? R(110, 4200) : R(20, 400);
          const err = name === "Bash" && rnd() < .08;
          step.items.push({ k: "tool", name, arg, dur: d, ok: !err, ts: t });

        <span class="k"><span class="sw" style="background:${SW.out}"></span>输出</span><span class="f">${full(s.out)} × $${pr.out}/M</span><span class="v">${money4(s.parts.out)}</span>
        <span class="tot"><span>本步合计</span><span>${money4(s.cost)}</span></span></div>
        <p class="src-note">思考 token 已含在输出里，不重复计费。价格来自本机价格目录，可在「用量 → 价格」查看。</p></div>
      <div class="ti-sec"><h4><span>上下文占用</span><span>${(s.ctx / 1e4).toFixed(1)}%</span></h4><div class="meterrow"><div class="meter"><i style="width:${s.ctx / 1e4}%"></i></div></div><p class="src-note" style="margin-top:6px">${full(s.ctx)} / 1,000,000 token = 输入 + 缓存读取 + 缓存写入</p></div>`;
    if (itab === "timing") {
      const tools = s.items.filter((x) => x.k === "tool" && x.dur);
      body = `<div class="ti-sec"><h4><span>本步时间线</span><span>${dur((s.next || s.end) - s.ts)}</span></h4><div class="tl">
        <div class="m"><span>请求发出</span><span>${clock(s.ts)}</span></div><div class="m"><span>模型生成 · ${dur(s.mdur)}</span><span>${clock(s.ts + s.mdur)}</span></div>
        ${tools.map((t) => `<div class="t"><span>${t.name} · ${dur(t.dur)}</span><span>${clock(t.ts + t.dur)}</span></div>`).join("")}
        <div><span>下一步开始</span><span>${clock(s.next || s.end)}</span></div></div>
        <p class="src-note">时长按相邻事件的时间戳推算；harness 没有记录首 token 时间，不显示 TTFT。</p></div>
        <div class="ti-sec"><h4><span>吞吐</span></h4><dl class="kv"><dt>输出速度</dt><dd>${(s.out / s.mdur * 1000).toFixed(0)} token/s（含排队与思考）</dd><dt>工具耗时</dt><dd>${dur(tools.reduce((a, t) => a + t.dur, 0))} · ${tools.length} 次</dd></dl></div>`;
    }
    if (itab === "overview") body = `<div class="ti-sec"><h4><span>这一步做了什么</span></h4><dl class="kv"><dt>模型</dt><dd class="mono">${s.model}</dd><dt>思考</dt><dd>${s.items.find((x) => x.k === "think")?.chars || 0} 字</dd><dt>回复</dt><dd>${s.items.filter((x) => x.k === "text").length} 段</dd><dt>工具</dt><dd>${s.items.filter((x) => x.k === "tool").map((x) => x.name).join("、") || "无"}</dd><dt>事件</dt><dd class="mono">#evt-${4000 + s.n}</dd></dl>
      <div class="cmd-actions"><button class="btn sm">${icon("chat")}在对话中定位</button></div></div>`;
  } else if (sel.type === "item") {
    const x = sel.item;
    if (x.k === "tool") {
      title = `${x.name} · 第 ${sel.step.n} 步`;
      sub = `<span>${x.live ? "运行中" : x.ok ? "成功" : "失败 · exit 1"}</span><span>${x.live ? "" : dur(x.dur)}</span><span>${clock(x.ts)}</span>`;
      tabs = [["params", "参数"], ["result", "结果"], ["timing", "计时"]];
      body = itab === "result" ? `<div class="ti-sec"><h4><span>输出</span><span>412 行 · 截断显示</span></h4><pre class="code-blk">✔ models.test.mjs (12 tests)\n✔ admin.test.mjs (8 tests)\n…\nexit 0</pre></div>`
        : itab === "timing" ? `<div class="ti-sec"><h4><span>计时</span></h4><dl class="kv"><dt>开始</dt><dd class="mono">${clock(x.ts)}.214</dd><dt>结束</dt><dd class="mono">${x.live ? "—" : clock(x.ts + x.dur) + ".638"}</dd><dt>时长</dt><dd>${x.live ? "运行中" : dur(x.dur)}</dd></dl></div>`
        : `<div class="ti-sec"><h4><span>command</span><button class="copy">复制</button></h4><pre class="code-blk">${esc(x.arg)}</pre></div><div class="ti-sec"><h4><span>description</span></h4><p style="margin:0;color:var(--text-2)">Run model tests</p></div>`;
    } else if (x.k === "agent") {
      const c = x.child;
      title = `子代理 · ${c.title}`;
      sub = `<span>${c.model}</span><span>${c.nsteps} 步</span><span>${dur(c.dur)}</span>`;
      tabs = [["usage", "用量"], ["overview", "概述"]];
      body = `<div class="ti-sec"><h4><span>子代理合计</span><span>${money(c.cost)}</span></h4><table class="cmp"><tbody>
        <tr><td><span class="sw" style="background:${SW.in}"></span>输入</td><td>${full(c.input)}</td></tr><tr><td><span class="sw" style="background:${SW.cr}"></span>缓存读取</td><td>${full(c.cr)}</td></tr>
        <tr><td><span class="sw" style="background:${SW.cw}"></span>缓存写入</td><td>${full(c.cw)}</td></tr><tr><td><span class="sw" style="background:${SW.out}"></span>输出</td><td>${full(c.out)}</td></tr>
        <tr class="tot"><td>费用</td><td>${money4(c.cost)}</td></tr></tbody></table><p class="src-note">已计入父会话合计 ${money(FAM.cost)}。</p></div>
        <div class="cmd-actions"><button class="btn sm">${icon("arrow")}打开子代理会话</button></div>`;
    } else {
      title = x.k === "think" ? "思考" : "回复";
      sub = `<span>第 ${sel.step.n} 步</span>`;
      tabs = [["overview", "内容"]];
      body = `<div class="ti-sec"><p style="margin:0;line-height:1.7;color:var(--text-2)">${esc(x.text || "（思考内容）")}</p></div>`;
    }
  } else {
    const t = sel.turn;
    title = `第 ${t.n} 轮`;
    sub = `<span>${t.steps.length} 步</span><span>${dur(t.end - t.ts)}</span>`;
    tabs = [["usage", "用量"]];
    body = `<div class="ti-sec"><h4><span>用户输入</span></h4><p style="margin:0;color:var(--text-2)">${esc(t.prompt)}</p></div>`;
  }
  if (!tabs.some(([k]) => k === itab)) itab = tabs[0][0];
  const nav = `<div class="nav"><button class="icon-btn xs" title="上一条 (k)">${icon("up")}</button><button class="icon-btn xs" title="下一条 (j)">${icon("down")}</button><button class="icon-btn xs" data-close title="关闭 (Esc)">${icon("x")}</button></div>`;
  box.innerHTML = `<div class="ti-h"><div class="t"><h3 title="${esc(title)}">${esc(title)}</h3><div class="sub">${sub}</div></div>${nav}</div>
    <div class="ti-tabs" role="tablist">${tabs.map(([k, n]) => `<button role="tab" data-itab="${k}" aria-selected="${itab === k}">${n}</button>`).join("")}</div><div class="ti-b">${body}</div>`;
}

        <span class="sw" style="background:var(--c5)"></span><span>子代理 · ${KIDS.length} 个 · ${KSUM.steps} 步</span><span class="v">${money(KSUM.cost)} <span class="p">${(KSUM.cost / FAM.cost * 100).toFixed(0)}%</span></span></div></div>
      <div class="ucard"><h3>Token<span class="sub">含子代理 · ${tok(allTok)}</span></h3>
        <div class="split" style="margin-top:4px">${t5.map(([, v, c]) => `<i style="flex:${v};background:${c};min-width:3px"></i>`).join("")}</div>
        <div class="legend">${t5.map(([n, v, c]) => `<span class="sw" style="background:${c}"></span><span>${n}</span><span class="v">${tok(v)}</span>`).join("")}<span class="sw" style="background:${SW.think}"></span><span>其中思考</span><span class="v">${tok(SELF.think)}</span></div></div>
      <div class="ucard"><h3>上下文<span class="sub">最后一步</span></h3><div class="big" style="font-size:24px">${(last.ctx / 1e4).toFixed(0)}%</div><div class="big-sub">${tok(last.ctx)} / 1.0M token</div>
        <div class="meter" style="margin-top:14px"><i style="width:${last.ctx / 1e4}%"></i></div><div class="big-sub">缓存命中率 ${(SELF.cr / (SELF.cr + SELF.cw + SELF.input) * 100).toFixed(1)}%</div></div>
    </div>
    <div class="ucard"><h3>每步费用<span class="sub">紫色为这一步启动的子代理 · 点击柱子跳到「链路」</span></h3>
      <div class="sbars">${TURNS.map((t) => `<div class="sgrp" style="flex:${t.steps.length}">${t.steps.map((s) => { const kc = s.items.filter((x) => x.k === "agent").reduce((a, x) => a + x.child.cost, 0); return `<div class="col" title="第 ${s.n} 步 ${money(s.cost)}${kc ? ` + 子代理 ${money(kc)}` : ""}">${kc ? `<i style="height:${kc / smx * 100}%;background:var(--c5)"></i>` : ""}<i style="height:${s.cost / smx * 100}%;background:var(--c1)"></i></div>`; }).join("")}</div>`).join("")}</div>
      <div class="sbars-x">${TURNS.map((t) => `<span style="flex:${t.steps.length}" title="${esc(t.prompt)}"><b>第 ${t.n} 轮</b> ${money(tot(t.steps, "cost") + t.steps.flatMap((s) => s.items.filter((x) => x.k === "agent")).reduce((a, x) => a + x.child.cost, 0))} · ${esc(t.prompt)}</span>`).join("")}</div></div>
    <div class="ucard"><h3>按模型</h3><table class="dt2"><thead><tr><th class="l">模型</th><th class="l">来自</th><th>步数</th><th>输入</th><th>缓存读</th><th>缓存写</th><th>输出</th><th>费用</th><th class="l">占比</th></tr></thead><tbody>
      ${models.map(([m, u, f]) => `<tr><td class="l mono">${m}</td><td class="l">${f}</td><td>${u.steps}</td><td>${tok(u.input)}</td><td>${tok(u.cr)}</td><td>${tok(u.cw)}</td><td>${tok(u.out)}</td><td class="b">${money(u.cost)}</td><td class="l"><span class="shr"><span class="mini"><i style="width:${u.cost / FAM.cost * 100}%;background:var(--c1)"></i></span>${(u.cost / FAM.cost * 100).toFixed(0)}%</span></td></tr>`).join("")}</tbody></table></div>

// ---------------------------------------------------------------- wiring
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab]"); if (t) return showTab(t.dataset.tab);
  const tw = e.target.closest("[data-tw]");
  if (tw) {
    const [k, v] = [tw.dataset.tw.slice(0, tw.dataset.tw.indexOf(":")), tw.dataset.tw.slice(tw.dataset.tw.indexOf(":") + 1)];
    const set = k === "turn" ? open.turns : k === "step" ? open.steps : open.kids;
    const val = k === "kid" ? v : +v;
    set.has(val) ? set.delete(val) : set.add(val);
    return renderTraj();
  }
  if (e.target.closest("[data-close]")) { selKey = ""; return renderTraj(); }
  const it = e.target.closest("[data-itab]"); if (it) { itab = it.dataset.itab; return renderInspector(); }
  const r = e.target.closest("tr[data-sel]"); if (r && !e.target.closest(".open")) { selKey = r.dataset.sel; return renderTraj(); }
  const s = e.target.closest("[data-s]"); if (s) { document.documentElement.dataset.scheme = s.dataset.s; $$("#dz [data-s]").forEach((b) => b.classList.toggle("on", b === s)); }
});
const P = new URLSearchParams(location.search);
if (P.get("sel") === "none") selKey = "";
else if (P.get("sel")) selKey = P.get("sel");
if (P.get("itab")) itab = P.get("itab");
renderList(); renderHead(); renderTraj(); renderUsage(); renderSubs(); renderInfo(); renderChat(); showTab(tab);
if (P.get("scroll")) $("#tt-wrap").scrollTop = +P.get("scroll");
</script>
